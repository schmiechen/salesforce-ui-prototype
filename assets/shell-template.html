<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Salesforce Prototype</title>
<style>
/* ==========================================================================
   Salesforce Lightning Design System 2 (Cosmos) — inlined by scripts/bundle.sh.
   Leave the marker line below intact until you run bundle.sh.
   ========================================================================== */
/*__SLDS2_COSMOS_CSS__*/
/* ==========================================================================
   App layout + thin helpers (my-* namespace; SLDS hooks with fallbacks).
   The STRUCTURE uses standard SLDS blueprints (page-header, tabs, table,
   form-element, card, path). my-* only adds shell/console/feed glue.
   ========================================================================== */
:root{ --my-navy:#16325C; --my-line:var(--slds-g-color-border-1,#e5e5e5); }
html,body{height:100%;margin:0;}
.my-app{display:flex;flex-direction:column;height:100vh;overflow:hidden;
  background:var(--slds-g-color-surface-container-1,#f3f3f3);}
.my-ghead,.my-appbar,.my-ws,.my-utilbar{flex:none;}

/* ----- global header (white; genuine logo + SLDS utility icons) ----- */
.my-ghead{display:flex;align-items:center;height:50px;background:#fff;gap:var(--slds-g-spacing-4,16px);
  padding-inline:var(--slds-g-spacing-4,16px);border-bottom:1px solid var(--my-line);}
.my-logo svg{height:24px;width:auto;display:block;}
.my-search-wrap{flex:1 1 auto;display:flex;justify-content:center;}
.my-search{position:relative;width:100%;max-width:600px;}
.my-search .ico{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#747474;pointer-events:none;}
.my-search input{width:100%;height:32px;font:inherit;font-size:.82rem;color:#181818;background:#fff;border:1px solid var(--slds-g-color-border-2,#c9c9c9);
  border-radius:4px;outline:none;padding:0 12px 0 28px;}
.my-search input:focus{border-color:#0176d3;box-shadow:0 0 3px #0176d3;}
.my-hicons{display:flex;align-items:center;gap:4px;flex:none;color:#5c5c5c;}
.my-hbtn{width:32px;height:32px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:#5c5c5c;}
.my-hbtn svg{width:20px;height:20px;display:block;fill:currentColor;}
.my-hbtn:hover{background:var(--slds-g-color-surface-container-2,#eef1f6);color:#0176d3;}
.my-avatar{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#e8734a;color:#fff;font-size:.55rem;font-weight:700;flex:none;}

/* ----- app context bar (navy) : waffle + app name + nav ----- */
.my-appbar{display:flex;align-items:stretch;height:2.5rem;background:#fff;color:#080707;padding:0 .25rem;border-bottom:1px solid var(--my-line);}
.my-waffle{display:grid;place-items:center;width:2.5rem;flex:none;background:transparent;border:0;cursor:pointer;color:#747474;}
.my-waffle svg{width:18px;height:18px;fill:currentColor;}
.my-waffle:hover{color:#0176d3;}
.my-appname{display:flex;align-items:center;font-weight:700;font-size:.9rem;padding:0 .75rem 0 .25rem;white-space:nowrap;flex:none;color:#080707;}
.my-appnav{display:flex;align-items:stretch;}
.my-navitem{display:flex;align-items:center;padding:0 .9rem;color:#514f4d;font-size:.8rem;cursor:pointer;border-bottom:3px solid transparent;background:transparent;border-top:0;border-left:0;border-right:0;font:inherit;}
.my-navitem:hover{background:var(--slds-g-color-surface-container-1,#f3f3f3);color:#0176d3;}
.my-navitem.is-active{color:#0176d3;border-bottom-color:#0176d3;font-weight:600;}

/* ----- console workspace tabs ----- */
.my-ws{display:flex;align-items:stretch;height:2.25rem;background:#fff;border-bottom:1px solid var(--my-line);padding:0 .25rem;overflow-x:auto;}
.my-wstab{display:flex;align-items:center;gap:.4rem;padding:0 .6rem;border:0;border-right:1px solid var(--my-line);background:transparent;font:inherit;font-size:.78rem;color:#514f4d;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;}
.my-wstab.is-active{color:#0176d3;border-bottom-color:#0176d3;font-weight:600;background:var(--slds-g-color-surface-container-1,#f7f9fb);}
.my-wstab .ico{width:14px;height:14px;display:grid;place-items:center;}
.my-wstab .x{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:#747474;}
.my-wstab .x:hover{background:#e5e5e5;color:#000;}
.my-wstab .x svg{width:9px;height:9px;fill:currentColor;}

/* ----- work area + record layout ----- */
.my-work{flex:1 1 auto;min-height:0;overflow:auto;padding:var(--slds-g-spacing-4,16px);}
.my-rec{display:grid;grid-template-columns:1fr 22rem;gap:var(--slds-g-spacing-4,16px);align-items:start;}
.my-rec.layout-3{grid-template-columns:16rem 1fr 22rem;}
@media(max-width:1100px){.my-rec,.my-rec.layout-3{grid-template-columns:1fr;}}
.my-side{background:#fff;border:1px solid var(--my-line);border-radius:4px;}

/* ----- object/utility icon square ----- */
.my-obj-icon{display:inline-grid;place-items:center;width:2rem;height:2rem;color:#fff;flex:none;border-radius:4px;}
.my-obj-icon svg{width:1rem;height:1rem;fill:currentColor;}
.my-obj-icon_s{width:1.5rem;height:1.5rem;}

/* ----- list view controls ----- */
.my-lv-controls{display:flex;align-items:center;gap:.25rem;}
.my-icbtn{width:32px;height:32px;border:1px solid var(--slds-g-color-border-2,#c9c9c9);background:#fff;border-radius:4px;cursor:pointer;display:grid;place-items:center;color:#5c5c5c;}
.my-icbtn svg{width:16px;height:16px;fill:currentColor;}
.my-icbtn:hover{background:#f3f3f3;color:#0176d3;}
.my-lv-search{position:relative;}
.my-lv-search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;fill:#747474;}
.my-lv-search input{height:32px;border:1px solid var(--slds-g-color-border-2,#c9c9c9);border-radius:4px;padding:0 10px 0 26px;font:inherit;font-size:.8rem;outline:none;}
.my-lv-switch{display:inline-flex;align-items:center;gap:.35rem;background:transparent;border:0;font:inherit;cursor:pointer;color:#080707;}
.my-lv-switch svg{width:14px;height:14px;fill:#747474;}
table.slds-table th.is-clickable{cursor:pointer;} table.slds-table th .my-sortarrow{color:#747474;font-size:.7rem;margin-left:.25rem;}
.my-tablewrap{overflow-x:auto;}
.my-lv-link{color:var(--slds-g-color-accent-1,#0176d3);font-weight:600;cursor:pointer;}
.my-lv-link:hover{text-decoration:underline;}
tr.my-rowlink:hover{background:var(--slds-g-color-surface-container-1,#f7fbff);}
.my-lv-foot{padding:.5rem .75rem;font-size:.72rem;color:var(--slds-g-color-on-surface-2,#747474);border-top:1px solid var(--my-line);}

/* ----- details (form read view) ----- */
.my-detail-sec{padding:1rem 0;border-bottom:1px solid var(--slds-g-color-border-1,#eee);}
.my-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem 2rem;}
@media(max-width:700px){.my-detail-grid{grid-template-columns:1fr;}}
.my-field .slds-form-element__label{color:var(--slds-g-color-on-surface-2,#747474);}
.my-field .slds-form-element__static{border-bottom:1px dotted transparent;padding:2px 0;}

/* ----- path (full-width interlocking chevrons in a white card) ----- */
.my-path-card{display:flex;align-items:center;gap:.75rem;background:#fff;border:1px solid var(--my-line);border-radius:.5rem;box-shadow:var(--slds-g-shadow-1,0 1px 2px rgba(0,0,0,.08));padding:.4rem;margin-bottom:var(--slds-g-spacing-4,16px);}
.my-path2{display:flex;flex:1 1 auto;min-width:0;gap:3px;}
.my-path2 .seg{flex:1 1 0;min-width:0;height:2rem;display:flex;align-items:center;justify-content:center;gap:.35rem;font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:var(--slds-g-color-surface-container-2,#ecebea);color:#514f4d;padding:0 10px;
  clip-path:polygon(0 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 0 100%, 13px 50%);}
.my-path2 .seg:first-child{border-radius:4px 0 0 4px;clip-path:polygon(0 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 0 100%);}
.my-path2 .seg:last-child{border-radius:0 4px 4px 0;clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%, 13px 50%);}
.my-path2 .seg.done{background:#b7e6c6;color:#0a5a2a;}
.my-path2 .seg.current{background:#032d60;color:#fff;}
.my-path2 .my-check{font-weight:800;}
.my-path-btn{flex:none;white-space:nowrap;}

/* ----- activity composer (icon pill buttons) + timeline ----- */
.my-act-composer{display:flex;gap:.5rem;padding:.6rem .75rem;flex-wrap:wrap;}
.my-act-pill{display:inline-flex;align-items:center;height:2rem;border:1px solid var(--slds-g-color-border-2,#c9c9c9);border-radius:999px;padding:0 .2rem 0 .3rem;gap:.05rem;background:#fff;cursor:pointer;}
.my-act-pill:hover{background:var(--slds-g-color-surface-container-1,#f3f3f3);}
.my-act-circle{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;color:#fff;} .my-act-circle svg{width:.85rem;height:.85rem;fill:currentColor;}
.my-act-caret{border:0;background:0;color:#747474;cursor:pointer;display:grid;place-items:center;padding:0 .15rem;} .my-act-caret svg{fill:currentColor;}
.my-act-filters{display:flex;align-items:center;justify-content:flex-end;gap:.5rem;color:#747474;font-size:.78rem;}
.my-icbtn-sm{width:1.75rem;height:1.75rem;border:1px solid var(--slds-g-color-border-2,#c9c9c9);border-radius:50%;background:#fff;display:grid;place-items:center;color:#747474;cursor:pointer;} .my-icbtn-sm svg{fill:currentColor;}
.my-act-links{text-align:right;font-size:.78rem;margin:.15rem .75rem .25rem;} .my-act-links a{color:var(--slds-g-color-accent-1,#0176d3);}
.my-act-group{background:var(--slds-g-color-surface-container-1,#f3f3f3);border-radius:4px;padding:.3rem .6rem;font-weight:600;font-size:.82rem;margin:.5rem .75rem .3rem;display:flex;align-items:center;gap:.4rem;color:#514f4d;} .my-act-group svg{fill:#747474;}
.my-tl{padding:0 .75rem .5rem;}
.my-tl-item{display:grid;grid-template-columns:1rem 1.75rem 1fr;gap:.4rem;align-items:start;}
.my-tl-exp{border:0;background:0;color:#747474;cursor:pointer;padding:.35rem 0 0;display:grid;place-items:center;} .my-tl-exp svg{fill:currentColor;transition:transform .2s;}
.my-tl-item.slds-is-open .my-tl-exp svg{transform:rotate(90deg);}
.my-tl-ico-col{display:flex;flex-direction:column;align-items:center;align-self:stretch;}
.my-tl-icon{width:1.75rem;height:1.75rem;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;} .my-tl-icon svg{width:.95rem;height:.95rem;fill:currentColor;}
.my-tl-conn{width:2px;flex:1;min-height:.5rem;margin-top:2px;}
.my-tl-item:last-child .my-tl-conn{display:none;}
.my-tl-body{min-width:0;padding-bottom:1rem;}
.my-tl-top{display:flex;align-items:center;gap:.5rem;}
.my-tl-title{color:var(--slds-g-color-accent-1,#0176d3);font-weight:600;cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .my-tl-title:hover{text-decoration:underline;}
.my-tl-date{color:#747474;font-size:.78rem;white-space:nowrap;flex:none;}
.my-tl-act{border:1px solid var(--slds-g-color-border-2,#c9c9c9);background:#fff;border-radius:50%;width:1.4rem;height:1.4rem;display:grid;place-items:center;color:#747474;cursor:pointer;flex:none;} .my-tl-act svg{fill:currentColor;}
.my-tl-sub{color:#747474;font-size:.8rem;}

/* ----- chatter feed ----- */
.my-pub{border:1px solid var(--slds-g-color-border-2,#c9c9c9);border-radius:6px;padding:.5rem;margin-bottom:1rem;}
.my-pub textarea{width:100%;border:0;outline:0;resize:vertical;font:inherit;min-height:2.5rem;}
.my-pub-actions{display:flex;align-items:center;gap:.35rem;margin-top:.35rem;}
.my-pub-actions .sp{flex:1;}
.my-post{padding:.7rem 0;border-bottom:1px solid var(--slds-g-color-border-1,#eee);}
.my-post-h{display:flex;align-items:flex-start;gap:.5rem;}
.my-post-acts{display:flex;gap:1rem;margin:.4rem 0 0 2.5rem;}
.my-post-act{display:inline-flex;align-items:center;gap:.3rem;background:0;border:0;font:inherit;font-size:.78rem;color:var(--slds-g-color-on-surface-2,#747474);cursor:pointer;}
.my-post-act.is-on{color:var(--slds-g-color-accent-1,#0176d3);font-weight:600;}
.my-post-act svg{width:13px;height:13px;fill:currentColor;}
.my-comment{display:flex;gap:.5rem;margin:.5rem 0 0 2.5rem;}
.my-cbox{display:flex;gap:.5rem;margin:.5rem 0 0 2.5rem;}
.my-cbox input{flex:1;height:30px;border:1px solid var(--slds-g-color-border-2,#c9c9c9);border-radius:15px;padding:0 12px;font:inherit;font-size:.8rem;outline:none;}
.my-avatar-sm{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;color:#fff;font-size:.7rem;font-weight:700;flex:none;}

/* ----- utility bar (custom; SLDS has no docked-utility-bar in this bundle) ----- */
.my-utilbar{display:flex;align-items:center;height:2rem;background:#fff;color:#514f4d;padding:0 .5rem;gap:.25rem;border-top:1px solid var(--my-line);box-shadow:0 -1px 2px rgba(0,0,0,.04);}
.my-util-disc{margin-left:auto;font-size:.65rem;color:#8c8c8c;padding-right:.5rem;}
.my-utilbtn{display:inline-flex;align-items:center;gap:.35rem;height:1.6rem;padding:0 .6rem;background:transparent;border:0;color:#514f4d;font:inherit;font-size:.72rem;cursor:pointer;border-radius:3px;}
.my-utilbtn:hover,.my-utilbtn.is-open{background:var(--slds-g-color-surface-container-1,#f3f3f3);color:#0176d3;}
.my-utilbtn svg{width:14px;height:14px;fill:currentColor;}
.my-utilpanel{position:fixed;bottom:2rem;width:340px;background:#fff;border:1px solid var(--my-line);border-radius:6px 6px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.18);display:none;z-index:60;}
.my-utilpanel.is-open{display:block;}
.my-utilpanel h3{margin:0;padding:.6rem .8rem;border-bottom:1px solid var(--my-line);font-size:.85rem;background:var(--slds-g-color-surface-container-1,#f3f3f3);}
.my-utilpanel .bd{padding:.8rem;font-size:.85rem;color:var(--slds-g-color-on-surface-2,#565656);}

/* ----- app launcher popover ----- */
.my-overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;z-index:70;} .my-overlay.is-open{display:block;}
.my-launcher{position:absolute;top:3.25rem;left:.5rem;width:340px;padding:1rem;z-index:71;display:none;background:#fff;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);} .my-launcher.is-open{display:block;}
.my-lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.25rem;}
.my-lapp{padding:.75rem .4rem;text-align:center;border-radius:.375rem;cursor:pointer;} .my-lapp:hover{background:var(--slds-g-color-surface-container-1,#f3f3f3);}
.my-lai{width:2.25rem;height:2.25rem;border-radius:.5rem;margin:0 auto .35rem;display:grid;place-items:center;color:#fff;} .my-lai svg{width:1.25rem;height:1.25rem;fill:currentColor;}

.my-fade{animation:myfade .3s ease;} @keyframes myfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.my-fade,.my-tl-caret{animation:none;transition:none;}}
</style>
</head>

    `<button class="my-navitem" onclick="setActive('home')">${SPEC.object.plural}</button>`;
  if(NAV_MODE!=="console") document.getElementById("wsTabs").style.display="none";
  renderUtil(); initLauncher(); renderWS(); renderWork();
}
function renderWS(){
  if(NAV_MODE!=="console") return;
  document.getElementById("wsTabs").innerHTML=TABS.map(t=>`
    <button class="my-wstab ${t.id===ACTIVE?"is-active":""}" onclick="setActive('${t.id}')">
      <span class="ico">${svg(t.icon,13)}</span><span>${esc(t.label)}</span>
      ${t.id!=="home"?`<span class="x" title="Close" onclick="event.stopPropagation();closeTab('${t.id}')">${svg("close",9)}</span>`:""}
    </button>`).join("");
}
function setActive(id){ ACTIVE=id; renderWS(); renderWork(); }
function closeTab(id){ TABS=TABS.filter(t=>t.id!==id); if(ACTIVE===id) ACTIVE="home"; renderWS(); renderWork(); }
function openRecord(row){
  const id="rec-"+row.id;
  if(!TABS.some(t=>t.id===id)) TABS.push({id,type:"record",label:row.number,icon:SPEC.object.icon,row});
  if(NAV_MODE!=="console"){ TABS=TABS.filter(t=>t.id==="home"||t.id===id); }
  setActive(id);
}
function renderWork(){
  const el=document.getElementById("work"); el.className="my-work my-fade";
  const tab=TABS.find(t=>t.id===ACTIVE)||TABS[0];
  if(tab.type==="record") renderRecord(tab.row); else renderList();
  void el.offsetWidth;
}

/* =========================================================================
   STANDARD LIST VIEW
   ========================================================================= */
function sortedRows(){
  const r=SPEC.rows.slice();
  if(SORT.col){ r.sort((a,b)=>String(a[SORT.col]).localeCompare(String(b[SORT.col]),undefined,{numeric:true})*SORT.dir); }
  return r;
}
function renderList(){
  const rows=sortedRows();
  const head=`
    <div class="slds-page-header slds-page-header_object-home slds-m-bottom_medium">
      <div class="slds-page-header__row">
        <div class="slds-page-header__col-title"><div class="slds-media slds-media_center">
          <div class="slds-media__figure">${objIcon(SPEC.object.icon)}</div>
          <div class="slds-media__body">
            <div class="slds-page-header__name"><div class="slds-page-header__name-title"><h1>
              <span class="slds-text-body_small">${SPEC.object.plural}</span>
              <button class="my-lv-switch"><span class="slds-page-header__title">${SPEC.listViews[0]}</span>${svg("chevrondown",14)}</button>
            </h1></div></div>
            <p class="slds-text-body_small slds-text-color_weak">${rows.length} items · sorted by ${SORT.col?colLabel(SORT.col):"Case Number"} · updated a moment ago</p>
          </div>
        </div></div>
        <div class="slds-page-header__col-actions"><div class="slds-page-header__controls">
          <div class="slds-button-group" role="group">
            <button class="slds-button slds-button_neutral">New</button>
            <button class="slds-button slds-button_neutral">Import</button>
          </div>
          <div class="my-lv-controls slds-m-left_x-small">
            <span class="my-lv-search">${svg("search",14)}<input type="search" placeholder="Search this list…" aria-label="Search this list"/></span>
            <button class="my-icbtn" title="Refresh">${svg("refresh",16)}</button>
            <button class="my-icbtn" title="Charts">${svg("metrics",16)}</button>
            <button class="my-icbtn" title="Filters">${svg("filterList",16)}</button>
            <button class="my-icbtn" title="List View Settings">${svg("settings",16)}</button>
          </div>
        </div></div>
      </div>
    </div>`;
  const ths=SPEC.columns.map(c=>{
    const sorted=SORT.col===c.key; const arrow=sorted?(SORT.dir>0?"▲":"▼"):"";
    return `<th class="slds-text-title_caps ${c.sortable?"is-clickable is-sortable":""} ${sorted?"slds-is-sorted":""}" scope="col" ${c.sortable?`onclick="sortBy('${c.key}')"`:""}>
      <div class="slds-truncate" title="${c.label}">${c.label}<span class="my-sortarrow">${arrow}</span></div></th>`;}).join("");
  const trs=rows.map(r=>`
    <tr class="slds-hint-parent my-rowlink">
      <td class="slds-cell-shrink"><input type="checkbox" class="my-rowchk" data-id="${r.id}" ${SELECTED.has(r.id)?"checked":""} onclick="event.stopPropagation();toggleSel('${r.id}',this.checked)" /></td>
      ${SPEC.columns.map(c=>{ const v = c.key==="priority" ? prBadge(r[c.key]) : c.link ? `<a class="my-lv-link" onclick="openRecordById('${r.id}')">${esc(r[c.key])}</a>` : esc(r[c.key]); return `<td><div class="slds-truncate" title="${esc(r[c.key])}">${v}</div></td>`; }).join("")}
      <td class="slds-cell-shrink"><button class="slds-button slds-button_icon slds-button_icon-border-filled" title="Show actions">${svg("chevrondown",12)}</button></td>
    </tr>`).join("");
  document.getElementById("work").innerHTML=head+`
    <div class="slds-card"><div class="my-tablewrap"><table class="slds-table slds-table_bordered slds-table_col-bordered slds-table_cell-buffer">
      <thead><tr class="slds-line-height_reset">
        <th class="slds-cell-shrink" scope="col"><input type="checkbox" onclick="toggleSelAll(this.checked)" aria-label="Select all"/></th>
        ${ths}<th class="slds-cell-shrink" scope="col"></th>
      </tr></thead>
      <tbody>${trs}</tbody>
    </table></div>
    <div class="my-lv-foot">${rows.length} items${SELECTED.size?` · ${SELECTED.size} selected`:""} · sorted by ${SORT.col?colLabel(SORT.col):"Case Number"}</div></div>`;
}
function colLabel(k){ return (SPEC.columns.find(c=>c.key===k)||{}).label||k; }
function sortBy(k){ if(SORT.col===k) SORT.dir*=-1; else {SORT.col=k;SORT.dir=1;} renderList(); }
function toggleSel(id,on){ on?SELECTED.add(id):SELECTED.delete(id); renderList(); }
function toggleSelAll(on){ SELECTED=new Set(on?SPEC.rows.map(r=>r.id):[]); renderList(); }
function openRecordById(id){ openRecord(SPEC.rows.find(r=>r.id===id)); }

/* =========================================================================
   STANDARD RECORD HOME (highlights + Details/Related + Activity/Chatter)
   ========================================================================= */
function renderRecord(row){
  const rec=recordFor(row);
  const highlights=`
    <div class="slds-page-header slds-m-bottom_medium">
      <div class="slds-page-header__row slds-grid_align-spread">
        <div class="slds-media slds-media_center slds-has-flexi-truncate"><div class="slds-media__figure">${objIcon(SPEC.object.icon)}</div>
          <div class="slds-media__body"><p class="slds-text-body_small slds-text-color_weak">${rec.meta}</p>
          <h1 class="slds-page-header__title slds-truncate" title="${esc(rec.name)}">${esc(rec.name)}</h1></div></div>
        <div class="slds-no-flex"><div class="slds-button-group" role="group">
          ${rec.actions.map((a,i)=>`<button class="slds-button ${i===0?"slds-button_brand":"slds-button_neutral"}">${a}</button>`).join("")}
        </div></div>
      </div>
      <ul class="slds-page-header__detail-row slds-grid slds-wrap">
        ${rec.highlights.map(h=>`<li class="slds-page-header__detail-block slds-p-right_x-large"><div class="slds-text-title_caps slds-text-color_weak">${h[0]}</div><div class="slds-truncate">${h[0]==="Priority"?prBadge(h[1]):esc(h[1])}</div></li>`).join("")}
      </ul>
    </div>`;
  const path=rec.path?renderPath(rec.path,rec.pathCurrent):"";
  const mainTabs=tabset("rec",[
    {label:"Details", html:renderDetails(rec)},
    {label:"Related", html:renderRelated(rec)},
  ]);
  const side=`<div class="my-side">`+tabset("side",[
    {label:"Activity", html:renderActivity(rec)},
    {label:"Chatter",  html:renderChatter(rec)},
  ],true)+`</div>`;
  const cls=RECORD_LAYOUT==="3-region"?"my-rec layout-3":"my-rec";
  const left=RECORD_LAYOUT==="3-region"?`<div>${rec.related.map(rl=>relatedCard(rl,true)).join("")}</div>`:"";
  // Highlights + path span the full record width; the columns sit below them.
  document.getElementById("work").innerHTML=`${highlights}${path}<div class="${cls}">${left}<div>${mainTabs}</div>${side}</div>`;
  wireTabs(document.getElementById("work")); wireActivity(); wireChatter();
}
function renderPath(stages,current){
  const ci=Math.max(0,stages.indexOf(current));
  const segs=stages.map((s,i)=>{
    const cls=i<ci?"done":i===ci?"current":"";
    const inner=i<ci?'<span class="my-check">&#10003;</span>':esc(s);
    return `<div class="seg ${cls}" title="${esc(s)}">${inner}</div>`;
  }).join("");
  return `<div class="my-path-card"><div class="my-path2">${segs}</div>
    <button class="slds-button slds-button_brand my-path-btn">&#10003; Mark Status as Complete</button></div>`;
}
function renderDetails(rec){
  return rec.detailSections.map(sec=>`
    <div class="my-detail-sec">
      <h3 class="slds-text-title_caps slds-text-color_weak slds-m-bottom_small">${sec.title}</h3>
      <div class="my-detail-grid">
        ${sec.fields.map(f=>`<div class="my-field slds-form-element slds-form-element_stacked slds-form-element_readonly">
          <span class="slds-form-element__label">${f[0]}</span>
          <div class="slds-form-element__control"><div class="slds-form-element__static">${f[0]==="Priority"?prBadge(f[1]):esc(f[1])}</div></div></div>`).join("")}
      </div>
    </div>`).join("");
}
function renderRelated(rec){ return rec.related.map(rl=>relatedCard(rl,false)).join(""); }
function relatedCard(rl,compact){
  return `<article class="slds-card slds-m-bottom_medium">
    <div class="slds-card__header slds-grid"><header class="slds-media slds-media_center slds-has-flexi-truncate">
      <div class="slds-media__figure">${objIcon(rl.icon,true)}</div>
      <div class="slds-media__body"><h2 class="slds-card__header-title">${rl.title} (${rl.rows.length})</h2></div></header>
      <div class="slds-no-flex"><button class="slds-button slds-button_neutral slds-button_small">New</button></div></div>
    <table class="slds-table slds-table_bordered slds-table_cell-buffer">
      <thead><tr class="slds-line-height_reset">${rl.columns.map(c=>`<th class="slds-text-title_caps" scope="col"><div class="slds-truncate">${c}</div></th>`).join("")}</tr></thead>
      <tbody>${rl.rows.map(r=>`<tr class="slds-hint-parent">${r.map((c,i)=>`<td><div class="slds-truncate" title="${esc(c)}">${i===0?`<a href="javascript:void(0)">${esc(c)}</a>`:esc(c)}</div></td>`).join("")}</tr>`).join("")}</tbody>
    </table>
    <footer class="slds-card__footer"><a href="javascript:void(0)">View All</a></footer></article>`;
}

/* ----- Activity timeline ----- */
function renderActivity(rec){
  const types=[["email","#939393"],["call","#48c3cc"],["event","#cb65ff"],["task","#4bc076"]];
  const composer=`<div class="my-act-composer">${types.map(t=>`
    <span class="my-act-pill" title="New ${t[0]}"><span class="my-act-circle" style="background:${t[1]}">${svg(t[0],14)}</span><button class="my-act-caret" aria-label="More">${svg("chevrondown",12)}</button></span>`).join("")}</div>`;
  const filters=`<div class="slds-p-horizontal_small"><div class="my-act-filters"><span>Filters: All time · All activities · All types</span><button class="my-icbtn-sm" title="Timeline Settings">${svg("settings",14)}</button></div></div>
    <div class="my-act-links"><a href="javascript:void(0)">Refresh</a> · <a href="javascript:void(0)">Expand All</a> · <a href="javascript:void(0)">View All</a></div>`;
  let items="", lastGroup=null;
  rec.activities.forEach((a,i)=>{
    if(a.group!==lastGroup){ items+=`<div class="my-act-group">${svg("chevrondown",12)} ${a.group}</div>`; lastGroup=a.group; }
    const col=ACT_COLOR[a.type]||"#747474";
    items+=`<div class="my-tl-item" data-i="${i}">
      <button class="my-tl-exp" aria-label="Expand">${svg("chevronright",11)}</button>
      <div class="my-tl-ico-col"><span class="my-tl-icon" style="background:${col}">${svg(a.type,14)}</span><span class="my-tl-conn" style="background:${col}"></span></div>
      <div class="my-tl-body">
        <div class="my-tl-top"><a class="my-tl-title" href="javascript:void(0)">${esc(a.title)}</a><span class="my-tl-date">${a.when}</span><button class="my-tl-act" aria-label="Show actions">${svg("chevrondown",11)}</button></div>
        <div class="my-tl-sub">${esc(a.sub||(a.type+" · "+a.who))}</div>
        <div class="my-tl-details" hidden><p class="slds-text-body_small slds-m-top_x-small">${esc(a.details)}</p><p class="slds-text-body_small slds-text-color_weak">${a.type} · ${esc(a.who)}</p></div>
      </div></div>`;
  });
  return composer+filters+`<div class="my-tl">${items}</div>`;
}
function wireActivity(){
  const toggle=el=>{ const it=el.closest(".my-tl-item"), d=it.querySelector(".my-tl-details"); const open=it.classList.toggle("slds-is-open"); if(d) d.hidden=!open; };
  document.querySelectorAll(".my-tl-exp").forEach(b=>b.onclick=function(){toggle(this);});
  document.querySelectorAll(".my-tl-title").forEach(a=>a.onclick=function(e){e.preventDefault();toggle(this);});
}

/* ----- Chatter feed ----- */
let FEED=[];
function renderChatter(rec){
  FEED=rec.feed;
  return `<div class="slds-p-around_small">
    <div class="my-pub"><textarea id="pubText" placeholder="Share an update…"></textarea>
      <div class="my-pub-actions">
        <button class="slds-button slds-button_icon" title="Attach">${svg("share",14)}</button>
        <button class="slds-button slds-button_icon" title="Mention">${svg("people",14)}</button>
        <span class="sp"></span>
        <button class="slds-button slds-button_brand slds-button_small" onclick="postShare()">Share</button>
      </div></div>
    <div id="feed">${FEED.map((p,i)=>postHtml(p,i)).join("")}</div>
  </div>`;
}
function postHtml(p,i){
  return `<div class="my-post" data-i="${i}">
    <div class="my-post-h"><span class="my-avatar-sm" style="background:${p.color}">${p.init}</span>
      <div style="min-width:0"><div><strong>${esc(p.author)}</strong> <span class="slds-text-body_small slds-text-color_weak">— ${p.when}</span></div>
      <div class="slds-text-body_regular">${mentions(p.text)}</div></div></div>
    <div class="my-post-acts">
      <button class="my-post-act ${p.liked?"is-on":""}" onclick="likePost(${i})">${svg("like",13)} <span>${p.likes?p.likes+" ":""}Like</span></button>
      <button class="my-post-act" onclick="toggleComment(${i})">${svg("comments",13)} Comment</button>
      <button class="my-post-act">${svg("share",13)} Share</button>
    </div>
    <div class="my-post-cs">${(p.comments||[]).map(c=>`<div class="my-comment"><span class="my-avatar-sm" style="width:1.5rem;height:1.5rem;font-size:.6rem;background:${c.color}">${c.init}</span><div><strong class="slds-text-body_small">${esc(c.author)}</strong><div class="slds-text-body_small">${mentions(c.text)}</div></div></div>`).join("")}</div>
    <div class="my-cbox" data-i="${i}" hidden><input placeholder="Write a comment…" onkeydown="if(event.key==='Enter')addComment(${i},this.value)"/></div>`;
}
function mentions(t){ return esc(t).replace(/@([A-Z][a-z]+ [A-Z][a-z]+)/g,'<span class="slds-text-link" style="color:var(--slds-g-color-accent-1,#0176d3)">@$1</span>'); }
function wireChatter(){/* handlers are inline for the feed; nothing extra */}
function likePost(i){ const p=FEED[i]; p.liked=!p.liked; p.likes=(p.likes||0)+(p.liked?1:-1); refreshFeed(); }
function toggleComment(i){ const b=document.querySelector(`.my-cbox[data-i="${i}"]`); if(b){b.hidden=!b.hidden; if(!b.hidden) b.querySelector("input").focus();} }
function addComment(i,val){ if(!val.trim())return; FEED[i].comments=FEED[i].comments||[]; FEED[i].comments.push({author:"You",init:"YOU".slice(0,2),color:"#5867e8",text:val}); refreshFeed(); }
function postShare(){ const t=document.getElementById("pubText"); if(!t.value.trim())return; FEED.unshift({author:"You",init:"Y",color:"#5867e8",when:"just now",text:t.value,likes:0,liked:false,comments:[]}); t.value=""; refreshFeed(); }
function refreshFeed(){ const f=document.getElementById("feed"); if(f) f.innerHTML=FEED.map((p,i)=>postHtml(p,i)).join(""); }

/* =========================================================================
   Tabset (SLDS) + wiring
   ========================================================================= */
let TABSEQ=0;
function tabset(prefix,tabs,scoped){
  const gid=prefix+(++TABSEQ);
  const nav=tabs.map((t,i)=>`<li class="slds-tabs_default__item ${i===0?"slds-is-active":""}" role="presentation">
    <a class="slds-tabs_default__link" href="javascript:void(0)" role="tab" aria-selected="${i===0}" aria-controls="${gid}-${i}" id="${gid}-${i}__t">${t.label}</a></li>`).join("");
  const panels=tabs.map((t,i)=>`<div id="${gid}-${i}" class="slds-tabs_default__content ${i===0?"slds-show":"slds-hide"}" role="tabpanel" aria-labelledby="${gid}-${i}__t">${t.html}</div>`).join("");
  return `<div class="slds-tabs_default"><ul class="slds-tabs_default__nav" role="tablist">${nav}</ul>${panels}</div>`;
}
function wireTabs(root){
  root.querySelectorAll(".slds-tabs_default").forEach(ts=>{
    const links=[...ts.querySelectorAll(":scope > .slds-tabs_default__nav > .slds-tabs_default__item")];
    links.forEach(li=>{ const a=li.querySelector(".slds-tabs_default__link");
      a.onclick=()=>{ links.forEach(x=>x.classList.remove("slds-is-active"));
        li.classList.add("slds-is-active");
        const id=a.getAttribute("aria-controls");
        [...ts.children].forEach(c=>{ if(c.classList&&c.classList.contains("slds-tabs_default__content")){
          c.classList.toggle("slds-show",c.id===id); c.classList.toggle("slds-hide",c.id!==id);} });
      };
    });
  });
}

/* =========================================================================
   Utility bar + app launcher
   ========================================================================= */
let UTIL_OPEN=null;
function renderUtil(){
  document.getElementById("utilbar").innerHTML=
    UTILITIES.map(u=>`<button class="my-utilbtn" data-u="${u.id}" onclick="toggleUtil('${u.id}')">${svg(u.icon,14)} ${u.label}</button>`).join("")
    +`<span class="my-util-disc">Illustrative demo — not a live system · fictitious data</span>`;
}
function toggleUtil(id){
  const p=document.getElementById("utilpanel"); const u=UTILITIES.find(x=>x.id===id);
  document.querySelectorAll(".my-utilbtn").forEach(b=>b.classList.toggle("is-open",b.dataset.u===id&&UTIL_OPEN!==id));
  if(UTIL_OPEN===id){ p.classList.remove("is-open"); UTIL_OPEN=null; return; }
  UTIL_OPEN=id;
  const btn=document.querySelector(`.my-utilbtn[data-u="${id}"]`);
  p.style.left=(btn.getBoundingClientRect().left)+"px";
  p.innerHTML=`<h3>${svg(u.icon,14)} ${u.label}</h3><div class="bd">${u.body}</div>`;
  p.classList.add("is-open");
}
const LAUNCH=[["case","Cases"],["people","Contacts"],["metrics","Reports"],["email","Email"],["clock","History"],["ai","Agentforce"]];
function initLauncher(){
  document.getElementById("lgrid").innerHTML=LAUNCH.map(a=>`<div class="my-lapp"><div class="my-lai" style="background:${ICONS[a[0]].c}">${svg(a[0],20)}</div><div class="slds-text-body_small" style="font-weight:600">${a[1]}</div></div>`).join("");
  const ov=document.getElementById("overlay"), lc=document.getElementById("launcher");
  const open=()=>{ov.classList.add("is-open");lc.classList.add("is-open");};
  document.getElementById("waffle").onclick=open;
  ov.onclick=()=>{ov.classList.remove("is-open");lc.classList.remove("is-open");};
}

boot();
</script>
