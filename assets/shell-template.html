<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Salesforce Prototype</title>
<style>
/* ==========================================================================
   Salesforce Lightning Design System 2 (Cosmos) — inlined by scripts/bundle.sh.
   Leave the marker line below intact until you run bundle.sh.
   ========================================================================== */
/*__SLDS2_COSMOS_CSS__*/
/* ==========================================================================
   App-specific layout + reusable helpers (my-* namespace; SLDS hooks w/ fallbacks)
   ========================================================================== */
:root{ --my-red:#ba0517; --my-amber:#dd7a01; --my-green:#2e844a; --my-purple:#5867e8; }
html,body{height:100%;margin:0;}
.my-shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;
  background:var(--slds-g-color-surface-container-1,#f3f3f3);}
.my-ghead,.my-navbar,.my-footer{flex:none;}
.app-body{display:flex;flex:1 1 auto;min-height:0;}
.app-rail{width:240px;flex:none;overflow:auto;background:var(--slds-g-color-surface-1,#fff);
  border-right:1px solid var(--slds-g-color-border-1,#e5e5e5);}
.app-main{flex:1 1 auto;min-width:0;overflow:auto;padding:var(--slds-g-spacing-4,16px);}
.my-main-inner{max-width:1100px;}
.app-right{width:340px;flex:none;overflow:auto;background:var(--slds-g-color-surface-1,#fff);
  border-left:1px solid var(--slds-g-color-border-1,#e5e5e5);padding:var(--slds-g-spacing-4,16px);}

/* ----- Global header — 50px, WHITE (Lightning console look).
   For the classic NAVY header instead: on .my-ghead set background:#16325C and drop the
   border-bottom; set .my-hicons/.my-hbtn/.my-star color:#fff with rgba(255,255,255,.4)
   borders and rgba(255,255,255,.16) hover; give .my-search input a white border. ----- */
.my-ghead{display:flex;align-items:center;height:50px;background:#fff;
  border-bottom:1px solid var(--slds-g-color-border-1,#e5e5e5);
  gap:var(--slds-g-spacing-4,16px);padding-inline:var(--slds-g-spacing-4,16px);}
.my-logo{display:flex;align-items:center;flex:none;}
.my-logo svg{height:24px;width:auto;display:block;}
.my-search-wrap{flex:1 1 auto;display:flex;justify-content:center;}
.my-search{position:relative;width:100%;max-width:600px;}
.my-search .ico{position:absolute;left:var(--slds-g-spacing-2,8px);top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:#747474;pointer-events:none;}
.my-search input{width:100%;height:32px;font:inherit;font-size:.82rem;color:#181818;background:#fff;
  border:1px solid var(--slds-g-color-border-2,#c9c9c9);border-radius:var(--slds-g-radius-border-2,4px);outline:none;
  padding-block:0;padding-inline:28px var(--slds-g-spacing-3,12px);}
.my-search input::placeholder{color:#747474;}
.my-search input:focus{border-color:#0176d3;box-shadow:0 0 3px #0176d3;}
.my-hicons{display:flex;align-items:center;flex:none;color:#5c5c5c;gap:var(--slds-g-spacing-1,4px);}
.my-hbtn{width:32px;height:32px;border-radius:50%;border:0;background:transparent;cursor:pointer;
  display:grid;place-items:center;color:#5c5c5c;}
.my-hbtn svg{width:20px;height:20px;display:block;}
.my-hbtn:hover{background:var(--slds-g-color-surface-container-2,#eef1f6);color:#0176d3;}
.my-star{display:flex;align-items:center;gap:2px;height:32px;color:#5c5c5c;background:transparent;cursor:pointer;
  padding-inline:var(--slds-g-spacing-1,4px);border:1px solid var(--slds-g-color-border-2,#c9c9c9);border-radius:16px;}
.my-star:hover{background:var(--slds-g-color-surface-container-2,#eef1f6);color:#0176d3;}
.my-star svg{display:block;}
.my-ghead .my-avatar{width:24px;height:24px;font-size:.55rem;margin-left:var(--slds-g-spacing-1,4px);}

/* ----- Nav row (white): waffle + app name + tabs + org context ----- */
.my-navbar{display:flex;align-items:stretch;height:2.75rem;background:#fff;padding:0 .5rem;
  border-bottom:1px solid var(--slds-g-color-border-1,#e5e5e5);box-shadow:0 1px 2px rgba(0,0,0,.05);}
.my-waffle{display:grid;place-items:center;width:2.75rem;flex:none;background:transparent;border:0;
  cursor:pointer;color:#747474;}
.my-waffle svg{width:20px;height:20px;display:block;}
.my-waffle:hover{color:#0176d3;}
.my-appname{display:flex;align-items:center;flex:none;white-space:nowrap;font-weight:700;font-size:.95rem;
  color:#080707;padding:0 1rem 0 .35rem;}
.my-tabs{display:flex;align-items:stretch;overflow-x:auto;}
.my-tab{display:flex;align-items:center;gap:.35rem;height:100%;padding:0 .9rem;border:0;background:transparent;
  font:inherit;font-size:.8rem;color:#514f4d;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;}
.my-tab:hover{color:#0176d3;background:var(--slds-g-color-surface-container-1,#f3f3f3);}
.my-tab.is-active{color:#0176d3;border-bottom-color:#0176d3;font-weight:600;}
.my-fut{font-size:.55rem;font-weight:700;letter-spacing:.03em;padding:.05rem .3rem;border-radius:.5rem;
  background:#eef0fe;color:#5867e8;}
.my-orgctx{margin-left:auto;display:flex;align-items:center;flex:none;white-space:nowrap;padding:0 .75rem;
  font-size:.72rem;color:#747474;}
.my-orgctx b{color:#080707;font-weight:600;}
@media(max-width:1120px){.my-orgctx{display:none;}}

/* ----- reusable content helpers ----- */
.my-obj-icon{display:inline-grid;place-items:center;width:2rem;height:2rem;color:#fff;flex:none;
  border-radius:var(--slds-g-radius-border-2,4px);}
.my-obj-icon svg{width:1rem;height:1rem;fill:currentColor;}
.my-obj-icon_s{width:1.5rem;height:1.5rem;}
.my-avatar{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;flex:none;
  background:#5867e8;color:#fff;font-size:.75rem;font-weight:700;}
.my-af-orb{width:2rem;height:2rem;border-radius:.5rem;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#0176d3,#5867e8,#9050e9);}
.my-af-orb svg{width:1.1rem;height:1.1rem;fill:currentColor;}
.my-af-label{font-size:.625rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--my-purple);}
.my-af-card{background:linear-gradient(180deg,#fbfaff,#f2f0fe);border:1px solid #e4e1f7;
  border-radius:var(--slds-g-radius-border-3,8px);padding:1rem;margin-bottom:1rem;}
.my-af-card ul{margin:.5rem 0 0;padding-left:1.1rem;} .my-af-card li{margin-bottom:.45rem;}
.my-person{display:flex;align-items:center;gap:.6rem;padding:.5rem 0;
  border-bottom:1px solid var(--slds-g-color-border-1,#eee);}
.my-tiles{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
.my-tile{background:var(--slds-g-color-surface-1,#fff);border:1px solid var(--slds-g-color-border-1,#e5e5e5);
  border-radius:var(--slds-g-radius-border-2,4px);padding:.75rem;box-shadow:var(--slds-g-shadow-1,0 1px 2px rgba(0,0,0,.08));}
.my-bars{display:flex;flex-direction:column;gap:.75rem;}
.my-bar-row{display:grid;grid-template-columns:130px 1fr 40px;gap:.6rem;align-items:center;}
.my-track{position:relative;height:1.25rem;border-radius:4px;overflow:hidden;
  background:var(--slds-g-color-surface-container-2,#ececec);}
.my-fill{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;
  padding-right:.35rem;color:#fff;font-size:.65rem;font-weight:700;transition:width .8s cubic-bezier(.2,.7,.2,1);}
.my-badge-purple{background:#eef0fe;color:var(--my-purple);}
tr.my-click{cursor:pointer;} tr.my-click:hover{background:var(--slds-g-color-surface-container-1,#f7fbff);}
.my-fade{animation:myfade .35s ease;}
@keyframes myfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.my-fade,.my-fill{animation:none;transition:none}}
.my-footer{background:var(--slds-g-color-surface-1,#fff);border-top:1px solid var(--slds-g-color-border-1,#e5e5e5);
  padding:.35rem 1rem;font-size:.7rem;text-align:center;color:var(--slds-g-color-on-surface-2,#747474);}
.my-overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;z-index:9000;}
.my-overlay.is-open{display:block;}
.my-launcher{position:absolute;top:5.9rem;left:.5rem;width:340px;padding:1rem;z-index:9001;display:none;
  background:var(--slds-g-color-surface-1,#fff);border-radius:var(--slds-g-radius-border-3,8px);
  box-shadow:var(--slds-g-shadow-3,0 4px 12px rgba(0,0,0,.2));}
.my-launcher.is-open{display:block;}
.my-lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.25rem;}
.my-lapp{padding:.75rem .4rem;text-align:center;border-radius:.375rem;cursor:pointer;}
.my-lapp:hover{background:var(--slds-g-color-surface-container-1,#f3f3f3);}
.my-lai{width:2.25rem;height:2.25rem;border-radius:.5rem;margin:0 auto .35rem;display:grid;place-items:center;color:#fff;}
.my-lai svg{width:1.25rem;height:1.25rem;fill:currentColor;}
@media(max-width:1120px){.app-right{width:290px;}}
@media(max-width:920px){.app-rail{display:none;}}
</style>
</head>

function svg(name,size){ const i=ICONS[name]||ICONS.case; size=size||18; return `<svg width="${size}" height="${size}" viewBox="${i.vb}" fill="currentColor" aria-hidden="true"><path d="${i.d}"/></svg>`; }
function objIcon(name,small){ const i=ICONS[name]||ICONS.case; return `<span class="my-obj-icon${small?' my-obj-icon_s':''}" style="background:${i.c}">${svg(name,small?14:16)}</span>`; }

const THEME = { red:"slds-theme_error", amber:"slds-theme_warning", green:"slds-theme_success", info:"slds-theme_info" };
function badge(text,type){ if(type==="purple") return `<span class="slds-badge my-badge-purple">${text}</span>`; return `<span class="slds-badge ${THEME[type]||""}">${text}</span>`; }

function card(iconName,title,sub,body,right){
  return `<article class="slds-card slds-m-bottom_medium">
    <div class="slds-card__header slds-grid">
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__figure">${objIcon(iconName)}</div>
        <div class="slds-media__body"><h2 class="slds-card__header-title">${title}</h2>
          ${sub?`<p class="slds-text-body_small slds-text-color_weak">${sub}</p>`:""}</div>
      </header>${right?`<div class="slds-no-flex">${right}</div>`:""}
    </div>
    <div class="slds-card__body slds-card__body_inner">${body}</div></article>`;
}
function pageHeader(iconName,meta,title,right){
  return `<div class="slds-page-header slds-m-bottom_medium"><div class="slds-page-header__row slds-grid_align-spread">
    <div class="slds-media slds-media_center slds-has-flexi-truncate"><div class="slds-media__figure">${objIcon(iconName)}</div>
      <div class="slds-media__body"><p class="slds-text-body_small slds-text-color_weak">${meta}</p>
      <h1 class="slds-page-header__title slds-truncate" title="${title}">${title}</h1></div></div>
    ${right?`<div class="slds-no-flex">${right}</div>`:""}</div></div>`;
}
function afPanel(heading,bulletsHtml,people){
  return `<div class="slds-media slds-media_center slds-m-bottom_medium">
    <div class="slds-media__figure"><span class="my-af-orb">${svg("ai",18)}</span></div>
    <div class="slds-media__body"><div class="my-af-label">Agentforce</div><div class="slds-text-heading_small">${heading}</div></div></div>
    <div class="my-af-card"><ul>${bulletsHtml}</ul></div>
    ${people?`<p class="slds-text-title_caps slds-text-color_weak slds-m-bottom_x-small">People</p>${people}`:""}`;
}

function navItem(ico,label,sub,o){ o=o||{};
  return `<li class="slds-nav-vertical__item ${o.active?"slds-is-active":""}">
    <a href="javascript:void(0)" class="slds-nav-vertical__action" ${o.active?'aria-current="page"':""}>
      <span class="slds-grid slds-grid_vertical-align-center" style="gap:.5rem">${svg(ico,15)}
      <span class="slds-truncate">${label}${sub?`<span class="slds-text-body_small slds-text-color_weak" style="display:block">${sub}</span>`:""}</span></span>
      ${o.badge?`<span class="slds-badge slds-badge_inverse slds-col_bump-left">${o.badge}</span>`:""}</a></li>`;
}
function navSection(title,items){ return `<div class="slds-nav-vertical__section"><h3 class="slds-nav-vertical__title">${title}</h3><ul>${items.join("")}</ul></div>`; }
function rail(sections){ return `<nav class="slds-nav-vertical slds-p-vertical_small" aria-label="Navigation">${sections.join("")}</nav>`; }

/* =========================================================================
   SHELL / VIEW ENGINE  (usually no need to edit below)
   ========================================================================= */
let active = TABS[0].id;
function renderTabs(){
  document.getElementById("appName").textContent = APP_NAME;
  document.getElementById("orgCtx").innerHTML = ORG_CTX;
  document.getElementById("hdrAvatar").textContent = AVATAR;
  document.getElementById("tabList").innerHTML = TABS.map(t=>`
    <button class="my-tab ${t.id===active?"is-active":""}" data-tab="${t.id}" role="tab" aria-selected="${t.id===active}" title="${t.label}">
      <span>${t.short}</span>${t.future?'<span class="my-fut">FUTURE</span>':""}</button>`).join("");
  document.querySelectorAll("#tabList .my-tab").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
}
function switchTab(id){ active=id; renderTabs(); (VIEWS[id]||function(){})(); }
function setRail(h){ document.getElementById("rail").innerHTML=h; }
function setMain(h){ const el=document.getElementById("main"); el.className="my-main-inner my-fade"; el.innerHTML=h; void el.offsetWidth; }
function setRight(h){ document.getElementById("rightp").innerHTML=h; }

/* =========================================================================
   VIEWS — one function per tab. Replace with your screens.
   ========================================================================= */
function viewRecord(){
  setRail(rail([
    navSection("Navigation",[ navItem("home","Home"), navItem("case","Cases","",{active:true}), navItem("people","Contacts") ]),
    navSection("Recent",[ navItem("case","00012345","Acme — priority",{active:true}), navItem("case","00012301","Globex") ]),
  ]));
  setMain(
    pageHeader("case","Case • Open","00012345", badge("Escalated","red"))
    + card("case","Details","Example record fields",
        `<dl class="slds-grid slds-wrap"><dt class="slds-size_1-of-2 slds-text-title_caps slds-text-color_weak">Subject</dt><dd class="slds-size_1-of-2">Widget not working</dd>
         <dt class="slds-size_1-of-2 slds-text-title_caps slds-text-color_weak slds-m-top_x-small">Priority</dt><dd class="slds-size_1-of-2 slds-m-top_x-small">High</dd>
         <dt class="slds-size_1-of-2 slds-text-title_caps slds-text-color_weak slds-m-top_x-small">Contact</dt><dd class="slds-size_1-of-2 slds-m-top_x-small">Jordan Lee</dd></dl>`)
    + card("email","Related — Emails","Related list example",
        `<table class="slds-table slds-table_bordered slds-table_cell-buffer">
           <thead><tr class="slds-line-height_reset"><th scope="col"><div class="slds-truncate slds-text-title_caps">Subject</div></th><th scope="col"><div class="slds-truncate slds-text-title_caps">Date</div></th></tr></thead>
           <tbody><tr class="slds-hint-parent"><td>Re: Widget issue</td><td>Today</td></tr><tr class="slds-hint-parent"><td>Case opened</td><td>Yesterday</td></tr></tbody></table>`));
  setRight(afPanel("Catch me up",
    `<li>Case opened yesterday; one reply pending.</li><li>Customer is a high-value account.</li>`,
    `<div class="my-person"><span class="my-avatar">JL</span><span><strong>Jordan Lee</strong><br><span class="slds-text-body_small slds-text-color_weak">Contact</span></span></div>`));
}
function viewList(){
  setRail(rail([ navSection("Navigation",[ navItem("home","Home"), navItem("list","All Cases","",{active:true}), navItem("metrics","Reports") ]) ]));
  const rows = [["00012345","Widget not working","High","Open"],["00012301","Login help","Medium","Open"],["00012299","Refund request","Low","Closed"]];
  setMain(
    pageHeader("list","Cases • List View","All Open Cases", `<button class="slds-button slds-button_brand">New</button>`)
    + card("case","Cases","3 items",
      `<table class="slds-table slds-table_bordered slds-table_cell-buffer">
        <thead><tr class="slds-line-height_reset">
          <th scope="col"><div class="slds-truncate slds-text-title_caps">Case #</div></th>
          <th scope="col"><div class="slds-truncate slds-text-title_caps">Subject</div></th>
          <th scope="col"><div class="slds-truncate slds-text-title_caps">Priority</div></th>
          <th scope="col"><div class="slds-truncate slds-text-title_caps">Status</div></th></tr></thead>
        <tbody>${rows.map(r=>`<tr class="slds-hint-parent my-click"><td>${r[0]}</td><td>${r[1]}</td><td>${badge(r[2], r[2]==="High"?"red":r[2]==="Medium"?"amber":"info")}</td><td>${r[3]}</td></tr>`).join("")}</tbody></table>`));
  setRight(`<p class="slds-text-title_caps slds-text-color_weak slds-m-bottom_x-small">Summary</p>
    <div class="my-tiles"><div class="my-tile"><div class="slds-text-title_caps slds-text-color_weak">Open</div><div class="slds-text-heading_large">2</div></div>
    <div class="my-tile"><div class="slds-text-title_caps slds-text-color_weak">Closed</div><div class="slds-text-heading_large">1</div></div></div>`);
}

const VIEWS = { record:viewRecord, list:viewList /*, future:viewFuture */ };

/* ----- app launcher ----- */
const LAUNCH=[["case","Cases"],["people","Contacts"],["metrics","Reports"],["dayview","Calendar"],["email","Email"],["list","Lists"]];
function initLauncher(){
  document.getElementById("lgrid").innerHTML = LAUNCH.map(a=>`<div class="my-lapp"><div class="my-lai" style="background:${ICONS[a[0]].c}">${svg(a[0],20)}</div><div class="slds-text-body_small" style="font-weight:600">${a[1]}</div></div>`).join("");
  const ov=document.getElementById("overlay"), lc=document.getElementById("launcher");
  document.getElementById("waffle").onclick=()=>{ ov.classList.add("is-open"); lc.classList.add("is-open"); };
  ov.onclick=()=>{ ov.classList.remove("is-open"); lc.classList.remove("is-open"); };
}

renderTabs(); initLauncher(); (VIEWS[active]||function(){})();
</script>
