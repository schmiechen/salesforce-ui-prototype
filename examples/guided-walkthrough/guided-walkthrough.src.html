<style>
/* ==========================================================================
   Salesforce Lightning Design System 2 (Cosmos) — inlined by scripts/bundle.sh.
   Leave the marker line below intact until you run bundle.sh.
   ========================================================================== */
/*__SLDS2_COSMOS_CSS__*/
/* ==========================================================================
   App layout + thin helpers (my-* namespace; SLDS hooks with fallbacks).
   The STRUCTURE uses standard SLDS blueprints (page-header, tabs, table,
   form-element, card, path). my-* only adds shell/console/feed glue.
   ========================================================================== */
:root{ --my-navy:#16325C; --my-line:var(--slds-g-color-border-1,#e5e5e5); }
html,body{height:100%;margin:0;}
.my-app{display:flex;flex-direction:column;height:100vh;overflow:hidden;
  background:var(--slds-g-color-surface-container-1,#f3f3f3);}
.my-ghead,.my-appbar,.my-ws,.my-utilbar{flex:none;}

/* ----- global header (white; genuine logo + SLDS utility icons) ----- */
.my-ghead{display:flex;align-items:center;height:50px;background:#fff;gap:var(--slds-g-spacing-4,16px);
  padding-inline:var(--slds-g-spacing-4,16px);border-bottom:1px solid var(--my-line);}
.my-logo svg{height:24px;width:auto;display:block;}
.my-search-wrap{flex:1 1 auto;display:flex;justify-content:center;}
.my-search{position:relative;width:100%;max-width:600px;}
.my-search .ico{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#747474;pointer-events:none;}
.my-search input{width:100%;height:32px;font:inherit;font-size:.82rem;color:#181818;background:#fff;border:1px solid var(--slds-g-color-border-2,#c9c9c9);
  border-radius:4px;outline:none;padding:0 12px 0 28px;}
.my-search input:focus{border-color:#0176d3;box-shadow:0 0 3px #0176d3;}
.my-hicons{display:flex;align-items:center;gap:4px;flex:none;color:#5c5c5c;}
.my-hbtn{width:32px;height:32px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:#5c5c5c;}
.my-hbtn svg{width:20px;height:20px;display:block;fill:currentColor;}
.my-hbtn:hover{background:var(--slds-g-color-surface-container-2,#eef1f6);color:#0176d3;}
/* Favorites = star + dropdown caret (tight pair, like the real header) */
.my-hbtn_star{margin-right:-6px;} .my-hbtn_caret{width:18px;} .my-hbtn_caret svg{width:11px;height:11px;}
.my-avatar{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#e8734a;color:#fff;font-size:.55rem;font-weight:700;flex:none;}

/* ----- app context bar (navy) : waffle + app name + nav ----- */
.my-appbar{display:flex;align-items:stretch;height:2.5rem;background:#fff;color:#080707;padding:0 .25rem;border-bottom:1px solid var(--my-line);}
.my-waffle{display:grid;place-items:center;width:2.5rem;flex:none;background:transparent;border:0;cursor:pointer;color:#747474;}
.my-waffle svg{width:18px;height:18px;fill:currentColor;}
.my-waffle:hover{color:#0176d3;}
.my-appname{display:flex;align-items:center;font-weight:700;font-size:.9rem;padding:0 .75rem 0 .25rem;white-space:nowrap;flex:none;color:#080707;}
.my-appnav{display:flex;align-items:stretch;}
.my-navitem{display:flex;align-items:center;padding:0 .9rem;color:#514f4d;font-size:.8rem;cursor:pointer;border-bottom:3px solid transparent;background:transparent;border-top:0;border-left:0;border-right:0;font:inherit;}
.my-navitem:hover{background:var(--slds-g-color-surface-container-1,#f3f3f3);color:#0176d3;}
.my-navitem.is-active{color:#0176d3;border-bottom-color:#0176d3;font-weight:600;}
.my-navitem{white-space:nowrap;flex:none;}
/* long tab lists: tighten on laptop widths so right-aligned header content is not pushed off-screen */
@media(max-width:1500px){.my-navitem{padding:0 .6rem;}}
@media(max-width:1360px){.my-navitem{padding:0 .4rem;font-size:.75rem;}}

/* ----- console workspace tabs ----- */
.my-ws{display:flex;align-items:stretch;height:2.25rem;background:#fff;border-bottom:1px solid var(--my-line);padding:0 .25rem;overflow-x:auto;}
.my-wstab{display:flex;align-items:center;gap:.4rem;padding:0 .6rem;border:0;border-right:1px solid var(--my-line);background:transparent;font:inherit;font-size:.78rem;color:#514f4d;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;}
.my-wstab.is-active{color:#0176d3;border-bottom-color:#0176d3;font-weight:600;background:var(--slds-g-color-surface-container-1,#f7f9fb);}
.my-wstab .ico{width:14px;height:14px;display:grid;place-items:center;}
.my-wstab .x{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:#747474;}
.my-wstab .x:hover{background:#e5e5e5;color:#000;}
.my-wstab .x svg{width:9px;height:9px;fill:currentColor;}

/* ----- work area + record layout ----- */
.my-work{flex:1 1 auto;min-height:0;overflow:auto;padding:var(--slds-g-spacing-4,16px);}
.my-rec{display:grid;grid-template-columns:1fr 22rem;gap:var(--slds-g-spacing-4,16px);align-items:start;}
.my-rec.layout-3{grid-template-columns:16rem 1fr 22rem;}
@media(max-width:1100px){.my-rec,.my-rec.layout-3{grid-template-columns:1fr;}}
.my-side{background:#fff;border:1px solid var(--my-line);border-radius:4px;}
/* outcome rail (Agentforce "why it matters") — main content left, docked agent panel right */
.my-with-rail{display:grid;grid-template-columns:1fr 21rem;gap:1rem;align-items:start;} @media(max-width:1100px){.my-with-rail{grid-template-columns:1fr;}}
/* docked agent panel: a scrollbar-style separator on the left, like an opened Agentforce agent */
.my-rail{border-left:1px solid var(--my-line);padding-left:1rem;align-self:stretch;} @media(max-width:1100px){.my-rail{border-left:0;padding-left:0;}}
.my-af-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem;}
.my-af-orb{width:2rem;height:2rem;border-radius:.5rem;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#0176d3,#5867e8,#9050e9);} .my-af-orb svg{width:1.1rem;height:1.1rem;fill:#fff;}
.my-af-label{font-size:.625rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:#5867e8;}
.my-af-card{background:linear-gradient(180deg,#fbfaff,#f2f0fe);border:1px solid #e4e1f7;border-radius:8px;padding:1rem;} .my-af-card ul{margin:0;padding-left:1.1rem;} .my-af-card li{margin-bottom:.45rem;}
.my-tiles{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.75rem;} .my-tile{background:#fff;border:1px solid var(--my-line);border-radius:4px;padding:.6rem;} .my-tile .k{font-size:.6rem;text-transform:uppercase;letter-spacing:.4px;color:#747474;} .my-tile .v{font-size:1.25rem;font-weight:800;}

/* ----- object/utility icon square ----- */
.my-obj-icon{display:inline-grid;place-items:center;width:2rem;height:2rem;color:#fff;flex:none;border-radius:4px;}
.my-obj-icon svg{width:1rem;height:1rem;fill:currentColor;}
.my-obj-icon_s{width:1.5rem;height:1.5rem;}

/* ----- list view controls ----- */
.my-lv-controls{display:flex;align-items:center;gap:.25rem;}
.my-icbtn{width:32px;height:32px;border:1px solid var(--slds-g-color-border-2,#c9c9c9);background:#fff;border-radius:4px;cursor:pointer;display:grid;place-items:center;color:#5c5c5c;}
.my-icbtn svg{width:16px;height:16px;fill:currentColor;}
.my-icbtn:hover{background:#f3f3f3;color:#0176d3;}
.my-lv-search{position:relative;}
.my-lv-search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;fill:#747474;}
.my-lv-search input{height:32px;border:1px solid var(--slds-g-color-border-2,#c9c9c9);border-radius:4px;padding:0 10px 0 26px;font:inherit;font-size:.8rem;outline:none;}
.my-lv-switch{display:inline-flex;align-items:center;gap:.35rem;background:transparent;border:0;font:inherit;cursor:pointer;color:#080707;}
.my-lv-switch svg{width:14px;height:14px;fill:#747474;}
table.slds-table th.is-clickable{cursor:pointer;} table.slds-table th .my-sortarrow{color:#747474;font-size:.7rem;margin-left:.25rem;}
.my-tablewrap{overflow-x:auto;}
.my-lv-link{color:var(--slds-g-color-accent-1,#0176d3);font-weight:600;cursor:pointer;}
.my-lv-link:hover{text-decoration:underline;}
tr.my-rowlink:hover{background:var(--slds-g-color-surface-container-1,#f7fbff);}
.my-lv-foot{padding:.5rem .75rem;font-size:.72rem;color:var(--slds-g-color-on-surface-2,#747474);border-top:1px solid var(--my-line);}

/* ----- details (form read view) ----- */
.my-detail-sec{padding:1rem 0;border-bottom:1px solid var(--slds-g-color-border-1,#eee);}
.my-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem 2rem;}
@media(max-width:700px){.my-detail-grid{grid-template-columns:1fr;}}
.my-field .slds-form-element__label{color:var(--slds-g-color-on-surface-2,#747474);}
.my-field .slds-form-element__static{border-bottom:1px dotted transparent;padding:2px 0;}

/* ----- path (genuine SLDS slds-path blueprint) ----- */
.my-path{margin-bottom:var(--slds-g-spacing-4,16px);}
.my-path .slds-path__stage svg{width:12px;height:12px;fill:currentColor;}

/* ----- activity composer (icon pill buttons) + timeline ----- */
.my-act-composer{display:flex;gap:.5rem;padding:.6rem .75rem;flex-wrap:wrap;}
.my-act-pill{display:inline-flex;align-items:center;height:2rem;border:1px solid var(--slds-g-color-border-2,#c9c9c9);border-radius:999px;padding:0 .2rem 0 .3rem;gap:.05rem;background:#fff;cursor:pointer;}
.my-act-pill:hover{background:var(--slds-g-color-surface-container-1,#f3f3f3);}
.my-act-circle{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;color:#fff;} .my-act-circle svg{width:.85rem;height:.85rem;fill:currentColor;}
.my-act-caret{border:0;background:0;color:#747474;cursor:pointer;display:grid;place-items:center;padding:0 .15rem;} .my-act-caret svg{fill:currentColor;}
.my-act-filters{display:flex;align-items:center;justify-content:flex-end;gap:.5rem;color:#747474;font-size:.78rem;}
.my-icbtn-sm{width:1.75rem;height:1.75rem;border:1px solid var(--slds-g-color-border-2,#c9c9c9);border-radius:50%;background:#fff;display:grid;place-items:center;color:#747474;cursor:pointer;} .my-icbtn-sm svg{fill:currentColor;}
.my-act-links{text-align:right;font-size:.78rem;margin:.15rem .75rem .25rem;} .my-act-links a{color:var(--slds-g-color-accent-1,#0176d3);}
.my-act-group{background:var(--slds-g-color-surface-container-1,#f3f3f3);border-radius:4px;padding:.3rem .6rem;font-weight:600;font-size:.82rem;margin:.5rem .75rem .3rem;display:flex;align-items:center;gap:.4rem;color:#514f4d;} .my-act-group svg{fill:#747474;}
/* genuine slds-timeline — small glue only */
.my-tl-wrap{padding:0 .5rem .5rem;}
.slds-timeline{list-style:none;margin:0;padding:0;}
.slds-timeline__trigger{cursor:pointer;}
.slds-timeline__icon{width:1.75rem;height:1.75rem;display:inline-grid;place-items:center;border-radius:50%;padding:0;flex:none;}
.slds-timeline__icon .slds-icon{width:1rem;height:1rem;fill:#fff;}
.slds-timeline__details-action-icon svg{width:12px;height:12px;fill:#747474;transition:transform .2s;}
.slds-timeline__item_expandable.slds-is-open .slds-timeline__details-action-icon svg{transform:rotate(90deg);}
.slds-timeline__date{white-space:nowrap;color:var(--slds-g-color-on-surface-2,#747474);}

/* ----- chatter feed ----- */
.my-pub{border:1px solid var(--slds-g-color-border-2,#c9c9c9);border-radius:6px;padding:.5rem;margin-bottom:1rem;}
.my-pub textarea{width:100%;border:0;outline:0;resize:vertical;font:inherit;min-height:2.5rem;}
.my-pub-actions{display:flex;align-items:center;gap:.35rem;margin-top:.35rem;}
.my-pub-actions .sp{flex:1;}
.my-post{padding:.7rem 0;border-bottom:1px solid var(--slds-g-color-border-1,#eee);}
.my-post-h{display:flex;align-items:flex-start;gap:.5rem;}
.my-post-acts{display:flex;gap:1rem;margin:.4rem 0 0 2.5rem;}
.my-post-act{display:inline-flex;align-items:center;gap:.3rem;background:0;border:0;font:inherit;font-size:.78rem;color:var(--slds-g-color-on-surface-2,#747474);cursor:pointer;}
.my-post-act.is-on{color:var(--slds-g-color-accent-1,#0176d3);font-weight:600;}
.my-post-act svg{width:13px;height:13px;fill:currentColor;}
.my-comment{display:flex;gap:.5rem;margin:.5rem 0 0 2.5rem;}
.my-cbox{display:flex;gap:.5rem;margin:.5rem 0 0 2.5rem;}
.my-cbox input{flex:1;height:30px;border:1px solid var(--slds-g-color-border-2,#c9c9c9);border-radius:15px;padding:0 12px;font:inherit;font-size:.8rem;outline:none;}
.my-avatar-sm{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;color:#fff;font-size:.7rem;font-weight:700;flex:none;}

/* ----- utility bar (custom; SLDS has no docked-utility-bar in this bundle) ----- */
.my-utilbar{display:flex;align-items:center;height:2rem;background:#fff;color:#514f4d;padding:0 .5rem;gap:.25rem;border-top:1px solid var(--my-line);box-shadow:0 -1px 2px rgba(0,0,0,.04);}
.my-util-disc{margin-left:auto;font-size:.65rem;color:#8c8c8c;padding-right:.5rem;}
.my-utilbtn{display:inline-flex;align-items:center;gap:.35rem;height:1.6rem;padding:0 .6rem;background:transparent;border:0;color:#514f4d;font:inherit;font-size:.72rem;cursor:pointer;border-radius:3px;}
.my-utilbtn:hover,.my-utilbtn.is-open{background:var(--slds-g-color-surface-container-1,#f3f3f3);color:#0176d3;}
.my-utilbtn svg{width:14px;height:14px;fill:currentColor;}
.my-utilpanel{position:fixed;bottom:2rem;width:340px;background:#fff;border:1px solid var(--my-line);border-radius:6px 6px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.18);display:none;z-index:60;}
.my-utilpanel.is-open{display:block;}
.my-utilpanel h3{margin:0;padding:.6rem .8rem;border-bottom:1px solid var(--my-line);font-size:.85rem;background:var(--slds-g-color-surface-container-1,#f3f3f3);}
.my-utilpanel .bd{padding:.8rem;font-size:.85rem;color:var(--slds-g-color-on-surface-2,#565656);}

/* ----- app launcher popover ----- */
.my-overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;z-index:70;} .my-overlay.is-open{display:block;}
.my-launcher{position:absolute;top:3.25rem;left:.5rem;width:340px;padding:1rem;z-index:71;display:none;background:#fff;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);} .my-launcher.is-open{display:block;}
.my-lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.25rem;}
.my-lapp{padding:.75rem .4rem;text-align:center;border-radius:.375rem;cursor:pointer;} .my-lapp:hover{background:var(--slds-g-color-surface-container-1,#f3f3f3);}
.my-lai{width:2.25rem;height:2.25rem;border-radius:.5rem;margin:0 auto .35rem;display:grid;place-items:center;color:#fff;} .my-lai svg{width:1.25rem;height:1.25rem;fill:currentColor;}

.my-fade{animation:myfade .3s ease;} @keyframes myfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.my-fade,.my-tl-caret,.my-cursor,.my-dots i,.my-build{animation:none;transition:none;}}
/* ----- motion primitives (shared by typewriter text, chat popup, auto-play, staged builds) ----- */
.my-cursor{display:inline-block;width:2px;height:1em;margin-left:1px;vertical-align:text-bottom;background:currentColor;animation:mycur 1s steps(1) infinite;} @keyframes mycur{50%{opacity:0}}
.my-dots{display:inline-flex;gap:4px;align-items:center;height:1.1em;} .my-dots i{width:6px;height:6px;border-radius:50%;background:var(--slds-g-color-on-surface-2,#757575);opacity:.5;animation:mydot 1.2s infinite ease-in-out;} .my-dots i:nth-child(2){animation-delay:.15s} .my-dots i:nth-child(3){animation-delay:.3s} @keyframes mydot{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.my-build{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease;} .my-build.is-in{opacity:1;transform:none;}

/* ===== snippets ===== */
/* autoplay.css: simulated mouse, click ripple and caption bar for autoplay.js */
.my-apcur{position:fixed;z-index:200;left:55%;top:65%;display:none;pointer-events:none;transition:left .85s cubic-bezier(.4,0,.2,1),top .85s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));}
.my-ripple{position:fixed;z-index:199;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid #0176d3;pointer-events:none;animation:myripple .7s ease-out forwards;}
@keyframes myripple{from{transform:scale(.4);opacity:.9}to{transform:scale(3.2);opacity:0}}
.my-apbar{position:fixed;left:50%;bottom:2.6rem;transform:translateX(-50%);z-index:210;display:none;flex-wrap:wrap;align-items:center;gap:.5rem .9rem;max-width:min(60rem,94vw);padding:.55rem 1rem;border-radius:999px;background:var(--slds-g-color-on-surface-2,#16325c);color:#fff;font-size:.85rem;box-shadow:0 4px 16px rgba(0,0,0,.3);}
.my-apbar .n{font-weight:700;white-space:nowrap;} .my-apbar .t{flex:1 1 18rem;} .my-apbar .h{font-size:.7rem;opacity:.75;white-space:nowrap;}
@media(prefers-reduced-motion:reduce){.my-apcur{transition:none;} .my-ripple{animation:none;opacity:0;}}
/* chat-popup.css: docked chat popup (pairs with .my-utilpanel from the shell template) */
.my-utilpanel.is-chat{width:25rem;height:min(35rem,calc(100vh - 7rem));overflow:hidden;flex-direction:column;box-shadow:0 -4px 18px rgba(0,0,0,.2);} .my-utilpanel.is-chat.is-open{display:flex;}
.my-chat-head{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;border-bottom:1px solid var(--my-line,#e5e5e5);background:#f6f4ff;flex:none;} .my-chat-head .ttl{flex:1;min-width:0;} .my-chat-head .sub{font-size:.7rem;color:#706e6b;}
.my-chat-x{border:0;background:transparent;cursor:pointer;font-size:1.2rem;line-height:1;color:#514f4d;padding:.1rem .4rem;border-radius:4px;} .my-chat-x:hover{background:#e8e6f7;}
.my-chat-log{display:flex;flex-direction:column;gap:.2rem;flex:1;min-height:0;padding:.7rem .8rem;overflow-y:auto;background:#fff;}
.my-chat-q{background:#e8eefc;border-radius:12px 12px 2px 12px;padding:.5rem .8rem;margin:.5rem 0 .2rem auto;max-width:85%;width:fit-content;font-size:.85rem;}
.my-chat-a{background:#fff;border:1px solid #e4e1f7;border-radius:12px 12px 12px 2px;padding:.6rem .85rem;max-width:94%;font-size:.85rem;line-height:1.45;margin-bottom:.2rem;} .my-chat-hello{background:#f6f4ff;}
.my-chat-cite{display:inline-grid;place-items:center;min-width:1.15rem;height:1.15rem;border-radius:50%;background:#e8eefc;color:#0b5cab;font-size:.65rem;font-weight:700;margin-left:.2rem;text-decoration:none;} .my-chat-cite:hover{background:#d3e0fb;}
.my-chat-foot{flex:none;border-top:1px solid var(--my-line,#e5e5e5);padding:.5rem .8rem .7rem;background:#fff;}
.my-chat-lbl{font-size:.65rem;letter-spacing:.04em;text-transform:uppercase;color:#706e6b;margin-bottom:.3rem;}
.my-chat-chips{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;margin-bottom:.5rem;}
.my-chat-chip{font:inherit;font-size:.75rem;text-align:left;background:#fff;border:1px solid #c9c9c9;border-radius:999px;padding:.3rem .7rem;cursor:pointer;color:#0b5cab;} .my-chat-chip:hover{background:#eef4ff;border-color:#0176d3;}
.my-chat-note{margin-top:.35rem;font-size:.65rem;color:#706e6b;}
/* field-mapper.css: Data 360 style field-mapping canvas (pairs with field-mapper.js) */
.my-map{position:relative;background:#f4f6f9;border:1px solid var(--my-line,#e5e5e5);border-radius:8px;overflow:hidden;}
.my-map-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:.9rem 1rem;background:#f3f3f3;border-bottom:1px solid var(--my-line,#e5e5e5);} .my-map-hd h3{margin:.1rem 0 .4rem;font-size:1.05rem;font-weight:700;}
.my-map-ds{font-size:.8rem;text-align:center;} .my-map-btns{display:flex;gap:.4rem;}
.my-map-srch{display:inline-block;position:relative;border:1px solid #c9c9c9;border-radius:4px;background:#fff;padding:.28rem .6rem;font-size:.75rem;color:#8a8a8a;min-width:13rem;}
.my-map-canvas{position:relative;display:grid;grid-template-columns:minmax(220px,300px) minmax(140px,1fr) minmax(220px,300px);padding:1rem;align-items:start;}
.my-map-pane{position:relative;z-index:1;background:#fff;border:1px solid #dddbda;border-radius:6px;padding:.7rem .75rem;} .my-map-pane h4{margin:0 0 .45rem;font-size:.85rem;font-weight:700;}
.my-map-q{position:relative;margin-bottom:.5rem;} .my-map-q .slds-input{font-size:.75rem;min-height:1.7rem;}

.my-map-row{display:flex;align-items:center;gap:.45rem;height:30px;padding:0 .5rem;border-top:1px solid #eee;font-size:.78rem;cursor:pointer;} .my-map-row:hover{background:#f7faff;} .my-map-row.un .nm{color:#706e6b;} .my-map-row.is-armed{background:#fff3c4;}
.my-map-row .ty{width:1.1rem;flex:none;text-align:center;font-size:.68rem;color:#706e6b;} .my-map-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .my-map-row .pk{font-size:.65rem;color:#706e6b;}
.my-map-port{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid #5c5c5c;background:radial-gradient(#5c5c5c 32%,#fff 38%);} .my-map-port.un{border-color:#c9c9c9;background:#fff;}
.my-map-wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0;} .my-map-wires path{fill:none;stroke:#747474;stroke-width:1.2;stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset .55s ease;} .my-map-wires path.pre{stroke-dashoffset:1;}
.my-map-nodes{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2;}
.my-map-node{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;display:flex;align-items:center;gap:3px;height:22px;padding:0 6px;background:#fff;border:1px solid #747474;border-radius:11px;font:inherit;font-size:.72rem;color:#444;cursor:pointer;transition:opacity .35s,transform .35s;} .my-map-node:hover{border-color:#ba0517;color:#ba0517;}
.my-map-node i{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;display:block;} .my-map-node.pre{opacity:0;transform:translate(-50%,-50%) scale(.6);}
.my-map-toast{position:absolute;right:1rem;bottom:1rem;background:#2e844a;color:#fff;padding:.45rem .9rem;border-radius:6px;font-size:.8rem;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none;z-index:5;} .my-map-toast.on{opacity:1;transform:none;}

function svg(n,size){ const i=ICONS[n]||ICONS.case; size=size||16; return `<svg width="${size}" height="${size}" viewBox="${i.vb}" fill="currentColor" aria-hidden="true"><path d="${i.d}"/></svg>`; }
function objIcon(n,small){ const i=ICONS[n]||ICONS.case; return `<span class="my-obj-icon${small?' my-obj-icon_s':''}" style="background:${i.c}">${svg(n,small?14:16)}</span>`; }
// Per-screen outcome panel ("why it matters"). OUTCOME_STYLE: agentforce | neutral.
function outcomeRail(o){ if(!o) return "";
  const tiles=(o.tiles&&o.tiles.length)?`<p class="slds-text-title_caps slds-text-color_weak slds-m-top_small slds-m-bottom_x-small">Directional / Illustrative</p><div class="my-tiles">${o.tiles.map(t=>`<div class="my-tile"><div class="k">${t[0]}</div><div class="v">${t[1]}</div></div>`).join("")}</div>`:"";
  const head=OUTCOME_STYLE==="agentforce"
    ? `<div class="my-af-head"><span class="my-af-orb">${svg("einstein",18)}</span><div><div class="my-af-label">Agentforce</div><div class="slds-text-heading_small">${o.title||"Why It Matters"}</div></div></div>`
    : `<p class="slds-text-title_caps slds-text-color_weak slds-m-bottom_x-small">${o.title||"Outcome"}</p>`;
  return head+`<div class="my-af-card"><ul>${(o.points||[]).map(p=>`<li>${p}</li>`).join("")}</ul></div>`+tiles;
}
const THEME={red:"slds-theme_error",amber:"slds-theme_warning",green:"slds-theme_success",info:"slds-theme_info"};
function badge(t,type){return `<span class="slds-badge ${THEME[type]||""}">${t}</span>`;}
function prBadge(p){return badge(p, p==="High"?"red":p==="Medium"?"amber":"info");}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
/* Motion gate: false while a walkthrough replays instantly, or when the user prefers reduced motion.
   Every animation (typewriter, staged builds, wire draw-in) should check animOK() and fall back to the final state. */
let REPLAYING=false;
const animOK=()=>!REPLAYING&&!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);

/* =========================================================================
   STATE + SHELL
   ========================================================================= */
let TABS=[{ id:"overview", type:"overview", label:"Overview", icon:"case" }];
let ACTIVE="overview"; let SORT={col:null,dir:1}; let SELECTED=new Set();

function boot(){
  document.getElementById("appName").textContent=APP.name;
  document.getElementById("hdrAvatar").textContent=APP.avatar;
  renderNav();
  if(NAV_MODE!=="console") document.getElementById("wsTabs").style.display="none";
  renderUtil(); initLauncher(); renderWS(); renderWork();
}
function renderWS(){
  if(NAV_MODE!=="console") return;
  document.getElementById("wsTabs").innerHTML=TABS.map(t=>`
    <button class="my-wstab ${t.id===ACTIVE?"is-active":""}" onclick="setActive('${t.id}')">
      <span class="ico">${svg(t.icon,13)}</span><span>${esc(t.label)}</span>
      ${t.id!=="home"?`<span class="x" title="Close" onclick="event.stopPropagation();closeTab('${t.id}')">${svg("close",9)}</span>`:""}
    </button>`).join("");
}
function setActive(id){ ACTIVE=id; renderWS(); renderWork(); }
function closeTab(id){ TABS=TABS.filter(t=>t.id!==id); if(ACTIVE===id) ACTIVE="home"; renderWS(); renderWork(); }
function openRecord(row){
  const id="rec-"+row.id;
  if(!TABS.some(t=>t.id===id)) TABS.push({id,type:"record",label:row.number,icon:SPEC.object.icon,row});
  if(NAV_MODE!=="console"){ TABS=TABS.filter(t=>t.id==="home"||t.id===id); }
  setActive(id);
}
function renderWork(){
  const el=document.getElementById("work"); el.className="my-work my-fade";
  const tab=TABS.find(t=>t.id===ACTIVE)||TABS[0];
  if(SCREENS[tab.type]) SCREENS[tab.type](); else if(tab.type==="record") renderRecord(tab.row); else renderList();
  void el.offsetWidth;
}

function sortedRows(){
  const r=SPEC.rows.slice();
  if(SORT.col){ r.sort((a,b)=>String(a[SORT.col]).localeCompare(String(b[SORT.col]),undefined,{numeric:true})*SORT.dir); }
  return r;
}

/* ===== snippets ===== */
/* autoplay.js: guided walkthrough engine for a single-file prototype.
   Paste into the prototype's script block (after the shell helpers) and put autoplay.css in the style block.
   Host contract: a `reset()` that returns the whole app to its first-screen state and re-renders.

   const walk = createAutoPlay({
     container: "#work",                 // scrollable region (scroll actions, scrollIntoView)
     reset: () => { resetState(); renderAll(); },
     steps: [
       // [caption, actions[], dwellMs]  (dwellMs = pause after the actions before auto-advancing)
       ["Open the overview.",         [ {click: byText(".my-navitem", "Overview", true)} ], 2500],
       ["Ask the agent a question.",  [ {click: bySel('.my-utilbtn[data-u="agent"]')},
                                        {type: bySel("#chatInput"), text: "Summarize this case"},
                                        {wait: 4000} ], 1500],
     ],
   });
   walk.bindKeys();   // ee = start/stop · ← → = step · Space = auto/manual · aa = mouse on/off · Esc = exit

   Actions:  {click:fn} {move:fn} {type:fn,text} {wait:ms} {scroll:y|-1} {run:fn,ms}
   `fn` resolvers are lazy: they run when the action runs and may return null (the action is then
   skipped and recorded in walk.missed, so a smoke test can assert that nothing was missed).
   Modes: "anim" (mouse + ripples + typing), "plain" (no mouse), "inst" (no waits; used to replay earlier steps).
   Stepping back = reset() + instant replay of steps 0..i-1 + live run of step i, so state is always deterministic. */

const byText = (sel, txt, exact) => () => [...document.querySelectorAll(sel)]
  .find(e => exact ? e.textContent.trim() === txt : e.textContent.includes(txt)) || null;
const bySel = sel => () => document.querySelector(sel);

function createAutoPlay(cfg) {
  const st = { mode: "off", i: -1, mouse: true, token: 0, timer: 0 };   // mode: off | auto | manual
  const missed = [];
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const root = () => document.querySelector(cfg.container || "body");
  const setReplay = v => { if (typeof REPLAYING !== "undefined") REPLAYING = v; };   // template motion gate

  /* ---- chrome: cursor, ripple, caption bar ---- */
  function cursor() {
    let c = document.getElementById("apcur");
    if (!c) {
      c = document.createElement("div"); c.id = "apcur"; c.className = "my-apcur";
      // decorative simulated-mouse pointer (not a UI icon, so it is not an SLDS glyph)
      c.innerHTML = '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path transform="scale(.9167)" d="M3 2l7 19 3-8 8-3z" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>';
      c.style.left = innerWidth * .55 + "px"; c.style.top = innerHeight * .65 + "px";
      document.body.appendChild(c);
    }
    return c;
  }
  function ripple(x, y) {
    const r = document.createElement("div"); r.className = "my-ripple"; r.style.left = x + "px"; r.style.top = y + "px";
    document.body.appendChild(r); setTimeout(() => r.remove(), 700);
  }
  function bar(msg) {
    let b = document.getElementById("apbar");
    if (!b) { b = document.createElement("div"); b.id = "apbar"; b.className = "my-apbar"; document.body.appendChild(b); }
    if (msg === false) { b.style.display = "none"; return; }
    const step = cfg.steps[st.i];
    const hint = (st.mode === "auto" ? "Auto-play · Space holds" : "Manual · Space auto-plays") + " · ← → step · aa mouse " + (st.mouse ? "on" : "off") + " · Esc exits";
    b.innerHTML = `<span class="n">Step ${st.i + 1} of ${cfg.steps.length}</span><span class="t">${msg || (step && step[0]) || ""}</span><span class="h">${hint}</span>`;
    b.style.display = "flex";
  }
  async function moveTo(el) {
    if (root() && root().contains(el)) el.scrollIntoView({ block: "center" });
    await sleep(120);
    const r = el.getBoundingClientRect(), x = r.left + Math.min(r.width / 2, 60), y = r.top + r.height / 2, c = cursor();
    c.style.display = "block"; c.style.left = x - 3 + "px"; c.style.top = y - 2 + "px";
    await sleep(900);
    return [x, y];
  }
  const fire = (el, type, key) => el.dispatchEvent(new KeyboardEvent(type, { key, bubbles: true }));

  /* ---- run one step's actions in a mode ---- */
  async function run(i, mode, tok) {
    setReplay(mode === "inst");
    try {
      for (const a of cfg.steps[i][1]) {
        if (tok !== st.token) return;
        if (a.wait) { if (mode !== "inst") await sleep(a.wait); continue; }
        if (a.scroll !== undefined) {
          const r = root(); if (!r) continue;
          const y = a.scroll === -1 ? r.scrollHeight : a.scroll;
          if (mode === "inst") r.scrollTop = y; else { r.scrollTo({ top: y, behavior: "smooth" }); await sleep(700); }
          continue;
        }
        if (a.run) { a.run(); if (mode !== "inst") await sleep(a.ms || 0); continue; }
        const el = (a.click || a.move || a.type)();
        if (!el) { missed.push({ step: i + 1, action: Object.keys(a).join(",") }); continue; }
        if (mode === "inst") {
          if (a.move) continue;
          if (a.type) { el.value = a.text; fire(el, "keydown", "Enter"); } else el.click();
        } else if (mode === "plain") {
          if (a.move) continue; await sleep(450);
          if (a.type) { el.value = a.text; fire(el, "keydown", "Enter"); } else el.click();
          await sleep(300);
        } else {
          const [x, y] = await moveTo(el); if (tok !== st.token) return;
          if (a.move) { await sleep(500); continue; }
          if (a.type) {
            el.focus(); await sleep(250);
            for (const ch of a.text) { if (tok !== st.token) return; el.value += ch; await sleep(45); }
            await sleep(350); fire(el, "keydown", "Enter"); await sleep(500);
          } else { await sleep(250); ripple(x, y); el.click(); await sleep(550); }
        }
      }
    } finally { setReplay(false); }
  }

  /* ---- navigation: always reset, replay earlier steps instantly, then run step i ---- */
  async function go(i, live) {
    const tok = ++st.token; clearTimeout(st.timer);
    st.i = i; bar(); cfg.reset();
    for (let k = 0; k < i; k++) { await run(k, "inst", tok); if (tok !== st.token) return; }
    await run(i, live ? (st.mouse ? "anim" : "plain") : "inst", tok);
    if (tok === st.token && st.mode === "auto") {
      const dwell = cfg.steps[i][2] || 2000;
      st.timer = setTimeout(i + 1 >= cfg.steps.length ? () => stop(true) : advance, dwell);
    }
  }
  function advance() { if (st.mode !== "off" && st.i + 1 < cfg.steps.length) go(st.i + 1, true); }
  function start() { st.mode = "auto"; go(0, true); }
  function stop(done) {
    st.token++; clearTimeout(st.timer); st.mode = "off"; setReplay(false);
    const c = document.getElementById("apcur"); if (c) c.style.display = "none";
    if (done) { bar("Walkthrough finished. Type ee to run it again, or ← to step back."); setTimeout(() => { if (st.mode === "off") bar(false); }, 4000); }
    else bar(false);
  }
  function next() {
    clearTimeout(st.timer);
    if (st.mode === "off") { st.mode = "manual"; go(0, true); return; }
    st.mode = "manual";
    if (st.i + 1 < cfg.steps.length) go(st.i + 1, true); else bar("End of walkthrough. ← goes back, Esc exits.");
  }
  function prev() { if (st.mode === "off") return; st.mode = "manual"; clearTimeout(st.timer); go(Math.max(0, st.i - 1), false); }
  function toggleAuto() {
    if (st.mode === "auto") { st.mode = "manual"; clearTimeout(st.timer); }
    else if (st.mode === "manual") { st.mode = "auto"; st.timer = setTimeout(advance, 1200); }
    bar();
  }
  function toggleMouse() {
    st.mouse = !st.mouse; const c = document.getElementById("apcur"); if (c && !st.mouse) c.style.display = "none";
    if (st.mode !== "off") bar();
  }

  /* ---- keyboard: ee / aa are double-taps (within 700 ms); ignored while typing in a field ---- */
  function bindKeys() {
    const last = {};
    const dbl = k => { const n = Date.now(), ok = n - (last[k] || 0) < 700; last[k] = ok ? 0 : n; return ok; };
    document.addEventListener("keydown", e => {
      if (e.target.closest && e.target.closest("input,textarea,select")) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.toLowerCase();
      if (k === "e") { if (dbl("e")) (st.mode === "off" ? start() : stop(false)); }
      else if (k === "a") { if (dbl("a")) toggleMouse(); }
      else if (st.mode === "off") return;
      else if (e.key === "Escape") stop(false);
      else if (e.key === "ArrowRight") next();
      else if (e.key === "ArrowLeft") prev();
      else if (e.key === " ") { e.preventDefault(); toggleAuto(); }
    });
  }

  return { start, stop, next, prev, go, toggleAuto, toggleMouse, bindKeys, missed, state: st };
}

/* chat-popup.js: an Agentforce "ask the record" chat, docked above the utility bar.
   Needs from the shell template: UTILITIES + toggleUtil/closeUtil (u.render / u.chat hooks), UTIL_OPEN,
   esc(), svg(), animOK(). Paste after those, with chat-popup.css in the style block.

   1) Add the utility-bar entry:   { id:"agent", label:"Agentforce", icon:"ai", body:"" }
   2) Create the chat:
        const chat = createChatPopup({
          utility: "agent",
          title: "Ask The Record",
          subtitle: () => "Case 00012345",
          greeting: () => "Hi, I'm Agentforce. Ask me about this case. Answers link to their source records.",
          suggestions: () => [ { q: "What changed on this order?", a: "The carrier **rescheduled** delivery twice.", refs: [2, 1] }, ... ],
          fallback: "In this demo, try one of the suggested questions.",
          cite: n => flashSource(n),               // called when a numbered citation chip is clicked
          citeTitle: n => SOURCES[n - 1].name,     // optional tooltip
        });
   Rules baked in: the suggestion row and input stay pinned (only the log re-renders), answers appear after a
   thinking-dots beat then type out (HTML-safe), asking again mid-answer completes the previous answer first,
   and everything is instant while animOK() is false (walkthrough replay or reduced motion).
   chat.ask(i) / chat.askText(text) / chat.reset() are exposed for auto-play steps and smoke tests. */

function createChatPopup(cfg) {
  const log = [];           // {q, a, refs, live}
  let timer = 0;
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  const isOpen = () => typeof UTIL_OPEN !== "undefined" && UTIL_OPEN === cfg.utility;
  const sug = () => cfg.suggestions();

  const cites = refs => (refs || []).map(n =>
    `<a class="my-chat-cite" href="javascript:void(0)" data-cite="${n}" title="${esc(cfg.citeTitle ? cfg.citeTitle(n) : "Source " + n)}">${n}</a>`).join("");
  const bubbles = () =>
    `<div class="my-chat-a my-chat-hello">${md(cfg.greeting())}</div>` +
    log.map(t => `<div class="my-chat-q">${esc(t.q)}</div>` + (t.live
      ? `<div class="my-chat-a" id="chatLive"><span class="my-dots"><i></i><i></i><i></i></span></div>`
      : `<div class="my-chat-a my-fade">${md(t.a)} ${cites(t.refs)}</div>`)).join("");
  const chips = () => {
    const left = sug().filter(s => !log.some(t => t.q === s.q));
    return left.length ? `<div class="my-chat-lbl">Suggested</div><div class="my-chat-chips">${left.map(s =>
      `<button class="my-chat-chip" data-q="${esc(s.q)}">${esc(s.q)}</button>`).join("")}</div>` : "";
  };

  function finish() { clearTimeout(timer); log.forEach(t => { t.live = false; }); }   // complete any in-flight answer

  function typeOut(t) {
    if (!t.live) return;
    const html = md(t.a); let i = 0;
    const el = () => document.getElementById("chatLive"), box = () => document.getElementById("chatLog");
    const tick = () => {
      const e = el(); if (!e || !t.live || !log.includes(t)) return;
      for (let n = 0; n < 2 && i < html.length; n++) {
        if (html[i] === "<") { i = html.indexOf(">", i) + 1; n--; continue; }   // never emit half a tag
        if (html[i] === "&") { i = html.indexOf(";", i) + 1; continue; }        // or half an entity
        i++;
      }
      if (i >= html.length) { t.live = false; e.removeAttribute("id"); e.classList.add("my-fade"); e.innerHTML = html + " " + cites(t.refs); }
      else { e.innerHTML = html.slice(0, i) + '<span class="my-cursor"></span>'; timer = setTimeout(tick, 22); }
      if (box()) box().scrollTop = box().scrollHeight;
    };
    timer = setTimeout(tick, 700);   // thinking dots first
  }

  function update() {   // log + suggestions only; header, input and footer never move
    if (!isOpen()) return;
    const l = document.getElementById("chatLog"), s = document.getElementById("chatSug");
    if (!l || !s) { render(document.getElementById("utilpanel")); return; }
    l.innerHTML = bubbles(); s.innerHTML = chips(); l.scrollTop = l.scrollHeight;
  }

  function push(entry) { finish(); entry.live = animOK(); log.push(entry); update(); typeOut(entry); }
  function ask(i) { const s = sug()[i]; if (!s || log.some(t => t.q === s.q)) return; push({ q: s.q, a: s.a, refs: s.refs }); }
  function askText(v) {
    const q = (v || "").trim().toLowerCase(); if (!q) return;
    const m = sug().findIndex(s => s.q.toLowerCase().includes(q.slice(0, 12)));
    if (m >= 0) return ask(m);
    push({ q: v.trim(), a: cfg.fallback || "In this demo, try one of the suggested questions.", refs: [] });
  }

  function render(panel) {
    finish();
    panel.innerHTML =
      `<div class="my-chat-head"><span class="my-af-orb">${svg("einstein", 18)}</span>
         <div class="ttl"><div class="my-af-label">Agentforce</div><div class="slds-text-heading_small">${esc(cfg.title || "Ask The Record")}</div>
         <div class="sub">${esc(cfg.subtitle ? cfg.subtitle() : "")}</div></div>
         <button class="my-chat-x" type="button" aria-label="Close">&times;</button></div>
       <div class="my-chat-log" id="chatLog">${bubbles()}</div>
       <div class="my-chat-foot"><div id="chatSug">${chips()}</div>
         <input class="slds-input" id="chatInput" placeholder="${esc(cfg.placeholder || "Ask a question…")}"/>
         <div class="my-chat-note">${esc(cfg.note || "AI-generated from source records. Verify before use.")}</div></div>`;
    panel.querySelector(".my-chat-x").onclick = closeUtil;
    panel.querySelector("#chatLog").onclick = e => { const c = e.target.closest("[data-cite]"); if (c && cfg.cite) cfg.cite(+c.dataset.cite); };
    panel.querySelector("#chatSug").onclick = e => { const b = e.target.closest("[data-q]"); if (b) ask(sug().findIndex(s => s.q === b.dataset.q)); };
    const input = panel.querySelector("#chatInput");
    input.addEventListener("keydown", e => { if (e.key === "Enter") { askText(input.value); input.value = ""; } });
    const l = panel.querySelector("#chatLog"); l.scrollTop = l.scrollHeight;
  }

  function reset() { finish(); log.length = 0; if (isOpen()) render(document.getElementById("utilpanel")); }

  const u = UTILITIES.find(x => x.id === cfg.utility);
  if (!u) throw new Error("createChatPopup: no UTILITIES entry with id '" + cfg.utility + "'");
  u.chat = true; u.render = render;
  return { ask, askText, reset, update, log };
}

/* field-mapper.js: a Data 360 (Data Cloud) style field-mapping canvas.
   Left: a data lake object (DLO) with its fields. Right: "Data Model entities" (DMOs) with their fields.
   Middle: one transform node per mapping, joined to both sides by wires. Needs esc() and animOK() from the
   shell template; put field-mapper.css in the style block.

   const mapper = renderFieldMapper(document.getElementById("mapHost"), {
     dlo: "Lead_Home", dataSpace: "default", callouts: true,       // callouts: numbered 1/2/3 badges on the searches
     fields: [ {id:"Email", type:"text"}, {id:"Annual Revenue", type:"number"}, {id:"Created Date", type:"date"} ],
     entities: [ {name:"Lead", fields:[ {id:"Lead Id", pk:true}, {id:"First Name"}, {id:"Annual Revenue", type:"number"} ]},
                 {name:"Contact Point Email", fields:[ {id:"Contact Point Email Id", pk:true}, {id:"Email Address"} ]} ],
     mappings: [ ["Email", "Contact Point Email.Email Address"] ],   // [sourceFieldId, "Entity.Field"]
     onChange: m => {}, onSave: m => {},                            // m = { sourceFieldId: "Entity.Field" }
   });
   Interactions: click a source port, then a target port, to create a mapping (the wire draws in). Click a transform
   node to remove its mapping. The searches filter fields. Save shows a toast. Everything is instant while animOK() is false.
   Controller: mapper.map(src, tgt) / unmap(src) / save() / get() / redraw(), for auto-play steps and smoke tests.
   Field names are illustrative: verify real DMO field names on the Data Model tab of your org. */

function renderFieldMapper(host, cfg) {
  const S = { map: {}, armed: null, qSrc: "", qTgt: "", open: {}, built: false };
  (cfg.mappings || []).forEach(([s, t]) => { S.map[s] = t; });
  const tgtKey = (e, f) => e.name + "." + f.id;
  const ico = t => ({ number: "#", date: "▦", id: "ID" }[t] || "Aa");
  const timers = [];

  host.innerHTML = `
    <div class="my-map">
      <div class="my-map-hd">
        <div><div class="slds-text-body_small slds-text-color_weak">Data Lake Objects</div><h3>${esc(cfg.dlo)} Mappings</h3>
          <div class="my-map-srch">Search Data Lake Objects…${cfg.callouts ? '<b class="my-map-co">1</b>' : ""}</div></div>
        <div class="my-map-ds"><b>Data Space</b><br>${esc(cfg.dataSpace || "default")}</div>
        <div class="my-map-btns"><button class="slds-button slds-button_neutral" data-act="close">Close</button>
          <button class="slds-button slds-button_neutral" data-act="saveclose">Save &amp; Close</button>
          <button class="slds-button slds-button_brand" data-act="save">Save</button></div>
      </div>
      <div class="my-map-canvas">
        <section class="my-map-pane"><h4>${esc(cfg.dlo)}</h4>
          <div class="my-map-q"><input class="slds-input" id="mapQSrc" placeholder="Search Fields…"/>${cfg.callouts ? '<b class="my-map-co">3</b>' : ""}</div>
          <div data-list="src"></div></section>
        <div class="my-map-mid"></div>
        <section class="my-map-pane"><h4>Data Model entities</h4>
          <div class="my-map-q"><input class="slds-input" id="mapQTgt" placeholder="Search Fields…"/>${cfg.callouts ? '<b class="my-map-co">2</b>' : ""}</div>
          <div data-list="tgt"></div></section>
        <svg class="my-map-wires" aria-hidden="true"></svg><div class="my-map-nodes"></div>
      </div>
      <div class="my-map-toast" role="status"></div>
    </div>`;
  const $ = s => host.querySelector(s);
  const canvas = $(".my-map-canvas"), svgEl = $(".my-map-wires"), nodes = $(".my-map-nodes");

  const srcMapped = () => cfg.fields.filter(f => S.map[f.id]);
  function paintLists() {
    const q1 = S.qSrc.trim().toLowerCase(), q2 = S.qTgt.trim().toLowerCase();
    const row = (f, key, side, mapped) =>
      `<div class="my-map-row ${mapped ? "" : "un"} ${S.armed === key ? "is-armed" : ""}" data-${side}="${esc(key)}">` +
      (side === "tgt" ? `<span class="my-map-port ${mapped ? "" : "un"}"></span>` : "") +
      `<span class="ty">${ico(f.type)}</span><span class="nm">${f.pk ? "* " : ""}${esc(f.label || f.id)}</span>${f.pk ? '<span class="pk">Primary Key</span>' : ""}` +
      (side === "src" ? `<span class="my-map-port ${mapped ? "" : "un"}"></span>` : "") + `</div>`;
    const sf = cfg.fields.filter(f => !q1 || (f.label || f.id).toLowerCase().includes(q1));
    const sm = sf.filter(f => S.map[f.id]), su = sf.filter(f => !S.map[f.id]);
    $('[data-list="src"]').innerHTML =
      `<div class="my-map-grp">Is Mapped (${sm.length})</div>${sm.map(f => row(f, f.id, "src", true)).join("")}` +
      `<div class="my-map-grp un">Unmapped (${su.length})</div>${su.map(f => row(f, f.id, "src", false)).join("")}`;
    const taken = new Set(Object.values(S.map));
    $('[data-list="tgt"]').innerHTML = cfg.entities.map(e => {
      const fs = e.fields.filter(f => !q2 || (f.label || f.id).toLowerCase().includes(q2));
      const m = fs.filter(f => taken.has(tgtKey(e, f))), u = fs.filter(f => !taken.has(tgtKey(e, f)));
      const show = S.open[e.name] || S.armed || q2;
      return `<div class="my-map-ent"><div class="my-map-eh">${esc(e.name)}</div><div class="my-map-grp">Is Mapped (${m.length})</div>` +
        m.map(f => row(f, tgtKey(e, f), "tgt", true)).join("") +
        `<div class="my-map-grp un my-map-tog" data-open="${esc(e.name)}">${show ? "▾" : "▸"} Unmapped (${u.length})</div>` +
        (show ? u.map(f => row(f, tgtKey(e, f), "tgt", false)).join("") : "") + `</div>`;
    }).join("");
  }

  function drawWires(hi) {
    timers.forEach(clearTimeout); timers.length = 0;
    const cr = canvas.getBoundingClientRect();
    svgEl.setAttribute("width", cr.width); svgEl.setAttribute("height", cr.height); svgEl.setAttribute("viewBox", `0 0 ${cr.width} ${cr.height}`);
    const mid = el => { const r = el.getBoundingClientRect(); return [r.left - cr.left + r.width / 2, r.top - cr.top + r.height / 2]; };
    const build = !S.built && animOK(); S.built = true;
    let paths = "", nd = ""; const list = [];
    srcMapped().forEach((f, k) => {
      const a = $(`[data-src="${CSS.escape(f.id)}"] .my-map-port`), b = $(`[data-tgt="${CSS.escape(S.map[f.id])}"] .my-map-port`);
      if (!a || !b) return;
      const [x1, y1] = mid(a), [x2, y2] = mid(b), nx = x1 + (x2 - x1) * .62, dx = (nx - 20 - x1) * .55;
      const pre = (build || (f.id === hi && animOK())) ? " pre" : "";
      paths += `<path class="${pre}" data-f="${esc(f.id)}" pathLength="1" d="M${x1} ${y1} C${x1 + dx} ${y1} ${nx - 20 - dx} ${y2} ${nx - 20} ${y2} L${x2} ${y2}"/>`;
      nd += `<button class="my-map-node${pre}" data-f="${esc(f.id)}" style="left:${nx}px;top:${y2}px" title="Remove mapping"><i></i><span>→</span><i></i></button>`;
      list.push(f.id);
    });
    svgEl.innerHTML = paths; nodes.innerHTML = nd;
    const show = id => { svgEl.querySelectorAll("path").forEach(p => p.dataset.f === id && p.classList.remove("pre"));
      nodes.querySelectorAll(".my-map-node").forEach(n => n.dataset.f === id && n.classList.remove("pre")); };
    if (build) list.forEach((id, k) => timers.push(setTimeout(() => show(id), 250 + k * 180)));
    else if (hi) timers.push(setTimeout(() => show(hi), 40));
  }

  function paint(hi) { paintLists(); drawWires(hi); }
  function toast(msg) { const t = $(".my-map-toast"); t.textContent = msg; t.classList.add("on"); timers.push(setTimeout(() => t.classList.remove("on"), 1800)); }
  const emit = () => cfg.onChange && cfg.onChange({ ...S.map });

  function map(src, tgt) {
    for (const k of Object.keys(S.map)) if (S.map[k] === tgt) delete S.map[k];   // a target takes one source
    S.map[src] = tgt; S.armed = null; paint(src); emit();
  }
  function unmap(src) { delete S.map[src]; S.armed = null; paint(); emit(); }
  function save() { toast("Mappings saved"); cfg.onSave && cfg.onSave({ ...S.map }); }

  host.addEventListener("click", e => {
    const act = e.target.closest("[data-act]");
    if (act) { if (act.dataset.act !== "close") save(); else toast("Closed without saving"); return; }
    const tog = e.target.closest("[data-open]"); if (tog) { S.open[tog.dataset.open] = !S.open[tog.dataset.open]; paint(); return; }
    const nd = e.target.closest(".my-map-node"); if (nd) { unmap(nd.dataset.f); return; }
    const s = e.target.closest("[data-src]"); if (s) { S.armed = S.armed === s.dataset.src ? null : s.dataset.src; paint(); return; }
    const t = e.target.closest("[data-tgt]"); if (t && S.armed) map(S.armed, t.dataset.tgt);
  });
  $("#mapQSrc").addEventListener("input", e => { S.qSrc = e.target.value; paint(); });
  $("#mapQTgt").addEventListener("input", e => { S.qTgt = e.target.value; paint(); });
  let rz = 0; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => host.isConnected && drawWires(), 150); });

  paint();
  return { map, unmap, save, get: () => ({ ...S.map }), redraw: () => paint() };
}


/* =========================================================================
   EXAMPLE SCREENS (fictional retail-support scenario)
   ========================================================================= */
const SECTIONS=[
  { id:"overview", label:"Overview",         icon:"case" },
  { id:"briefing", label:"Case Briefing",    icon:"ai" },
  { id:"mapping",  label:"Data 360 Mapping", icon:"metrics" },
  { id:"results",  label:"Results",          icon:"task" },
];
function renderNav(){
  const cur=TABS.find(t=>t.id===ACTIVE)||TABS[0];
  document.getElementById("appNav").innerHTML=SECTIONS.map(x=>`<button class="my-navitem ${x.id===cur.type?"is-active":""}" onclick="goSection('${x.id}')">${x.label}</button>`).join("");
}
function goSection(id){
  const x=SECTIONS.find(v=>v.id===id); if(id==="results") SLIDE=1;
  TABS=[{ id, type:id, label:x.label, icon:x.icon }]; ACTIVE=id; renderNav(); renderWork();
}
const railed=(main,rail)=>`<div class="my-with-rail"><div>${main}</div><div class="my-rail">${outcomeRail(rail)}</div></div>`;
const pageHead=(eyebrow,title,icon)=>`<div class="slds-page-header slds-m-bottom_medium"><div class="slds-media slds-media_center"><div class="slds-media__figure">${objIcon(icon||"case")}</div><div class="slds-media__body"><p class="slds-text-body_small slds-text-color_weak">${eyebrow}</p><h1 class="slds-page-header__title">${title}</h1></div></div></div>`;
const card=(title,body)=>`<article class="slds-card slds-m-bottom_medium"><div class="slds-card__header"><h2 class="slds-card__header-title">${title}</h2></div><div class="slds-card__body slds-card__body_inner">${body}</div></article>`;

/* ---- Case Briefing: summary + numbered source records (citation targets for the chat popup) ---- */
const SOURCES=[
  { name:"Case 00001045",   what:"Subject and description entered by the customer" },
  { name:"Knowledge Article", what:"Firmware 3.2: power-cycle and rollback steps" },
  { name:"Case 00001012",   what:"Earlier case on the same device, resolved by rollback" },
];
const CHAT_QA=[
  { q:"What is the customer reporting?", a:"Acme Corp says the **widget won't power on** after the 3.2 firmware update. The case is marked **High** priority.", refs:[1] },
  { q:"Is there a known fix?", a:"A knowledge article describes a **power-cycle and firmware rollback** procedure for version 3.2.", refs:[2,3] },
  { q:"Has this happened before?", a:"One earlier case (00001012) matched the same device and was resolved with a **rollback**.", refs:[3] },
];
function flashSource(n){
  const card=document.getElementById("src"+n); if(!card) return;
  card.scrollIntoView({block:"nearest",behavior:"smooth"});
  card.classList.add("is-flash"); setTimeout(()=>card.classList.remove("is-flash"),1400);
}
function citeClick(n){ if(ACTIVE!=="briefing"){ goSection("briefing"); setTimeout(()=>flashSource(n),250); } else flashSource(n); }
const chat=createChatPopup({
  utility:"agent", title:"Ask The Record", subtitle:()=>"Case 00001045",
  greeting:()=>"Hi, I'm Agentforce. Ask me about this case. Every answer links to its source records.",
  suggestions:()=>CHAT_QA, cite:citeClick, citeTitle:n=>SOURCES[n-1].name+": "+SOURCES[n-1].what,
});
function renderBriefing(){
  const src=SOURCES.map((x,i)=>`<div class="my-src" id="src${i+1}"><span class="n">${i+1}</span><div><div><b>${x.name}</b></div><div class="slds-text-body_small slds-text-color_weak">${x.what}</div></div></div>`).join("");
  document.getElementById("work").innerHTML=railed(
    pageHead("Case 00001045 · High priority","Widget won't power on after update")+
    card("Agent Summary",`<p>The customer reports a power failure after the 3.2 firmware update. A rollback has resolved the same symptom on a previous case.</p>
      <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">Open Agentforce in the utility bar below to ask questions. Answers cite the numbered source records.</p>`)+
    card("Source Records",src),
    { title:"Why It Matters", points:["The summary, the sources, and the agent's answers sit on one screen.","Every answer links back to a record you can open."], tiles:[["Sources","3"],["Answers","Cited"]] });
}

/* ---- Data 360 Mapping ---- */
let MAPPER=null;
function renderMapping(){
  document.getElementById("work").innerHTML=railed(
    pageHead("Data 360 · Data Streams","Map Lead_Home to the Data Model","metrics")+
    card("Field Mapping",`<div id="mapHost"></div>
      <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">Click a source field, then a target field, to map it. Click a transform node to remove a mapping. Field names are illustrative.</p>`),
    { title:"Why It Matters", points:["Mapping connects a data lake object to the shared Data Model.","Mapped fields can then be used for unified profiles and segments."], tiles:[["Source","Lead_Home"],["Data Space","default"]] });
  MAPPER=renderFieldMapper(document.getElementById("mapHost"),{
    dlo:"Lead_Home", dataSpace:"default", callouts:true,
    fields:[
      {id:"Lead Id",type:"id"},{id:"First Name"},{id:"Last Name"},{id:"Company"},{id:"Email"},{id:"Phone"},
      {id:"City"},{id:"Country"},{id:"Postal Code"},{id:"Annual Revenue",type:"number"},{id:"Lead Source"},{id:"Created Date",type:"date"},
    ],
    entities:[
      {name:"Lead", fields:[{id:"Lead Id",pk:true,type:"id"},{id:"First Name"},{id:"Last Name"},{id:"Company"},{id:"Annual Revenue",type:"number"},{id:"Lead Source"},{id:"Created Date",type:"date"}]},
      {name:"Contact Point Email", fields:[{id:"Contact Point Email Id",pk:true,type:"id"},{id:"Email Address"}]},
      {name:"Contact Point Phone", fields:[{id:"Contact Point Phone Id",pk:true,type:"id"},{id:"Phone Number"}]},
      {name:"Contact Point Address", fields:[{id:"Contact Point Address Id",pk:true,type:"id"},{id:"City"},{id:"Country"},{id:"Postal Code"}]},
    ],
    mappings:[["Lead Id","Lead.Lead Id"],["First Name","Lead.First Name"],["Last Name","Lead.Last Name"],["Company","Lead.Company"],
      ["Annual Revenue","Lead.Annual Revenue"],["Email","Contact Point Email.Email Address"],["City","Contact Point Address.City"],
      ["Country","Contact Point Address.Country"],["Postal Code","Contact Point Address.Postal Code"]],
  });
}

/* ---- Results: two slides, staged build, pinned banner ---- */
let SLIDE=1, BUILD_T=[];
const BANNER=`<span class="ico">✓</span><div><div class="lbl">Today</div><div class="msg">The queue is on track for the day (illustrative figures).</div></div>`;
function nextSlide(){ SLIDE=2; renderResults(); document.getElementById("work").scrollTop=0; }
function prevSlide(){ SLIDE=1; renderResults(); document.getElementById("work").scrollTop=0; }
function renderResults(){
  BUILD_T.forEach(clearTimeout); BUILD_T=[];
  const kpis=[["Open Cases","5","Across all queues"],["First Response","1h 12m","Median, today"],["SLA Attainment","96%","Rolling 7 days"]]
    .map(k=>`<div class="my-kpi my-build"><div class="k">${k[0]}</div><div class="v">${k[1]}</div><div class="d">${k[2]}</div></div>`).join("");
  const s1=card("Support Results At A Glance",`<div class="my-kpis">${kpis}</div><div class="my-banner my-build">${BANNER}</div>`)+
    `<div class="my-slidenav"><span></span><button class="slds-button slds-button_brand" id="nextBtn" onclick="nextSlide()">Next →</button></div>`;
  const s2=`<div class="my-banner is-pinned">${BANNER}</div><div class="my-fade">`+
    card("What The Agent Did Today",`<div class="my-steps-row"><div>Summarized 3 cases</div><div>Drafted 2 customer replies</div><div>Linked 4 knowledge articles</div><div>Flagged 1 SLA risk</div></div>`)+
    card("Where The Data Came From",`<p>Case records, knowledge articles, and mapped lead data from the Data 360 stream.</p>`)+`</div>
    <div class="my-slidenav"><button class="slds-button slds-button_neutral" id="backBtn" onclick="prevSlide()">← Back</button><span></span></div>`;
  document.getElementById("work").innerHTML=railed(pageHead("Results · Today","Today's Support Results","task")+(SLIDE===1?s1:s2),
    { title:"Why It Matters", points:["Results appear one step at a time, then stay on screen.","The headline stays pinned while the details scroll."], tiles:[["Slide",String(SLIDE)+" of 2"],["Data","Illustrative"]] });
  const items=[...document.querySelectorAll("#work .my-build")];
  if(!animOK()) items.forEach(e=>e.classList.add("is-in"));
  else [300,1000,1700,2600].forEach((ms,k)=>BUILD_T.push(setTimeout(()=>{ if(items[k]&&items[k].isConnected) items[k].classList.add("is-in"); },ms)));
}

const SCREENS={ overview:()=>renderRecord(SPEC.rows[0]), briefing:renderBriefing, mapping:renderMapping, results:renderResults };

/* ---- walkthrough ---- */
function resetDemo(){
  BUILD_T.forEach(clearTimeout); chat.reset(); closeUtil(); SLIDE=1; MAPPER=null;
  goSection("overview"); document.getElementById("work").scrollTop=0;
}
const agentBtn=bySel('.my-utilbtn[data-u="agent"]');
const walk=createAutoPlay({
  container:"#work", reset:resetDemo,
  steps:[
    ["Overview: the case record shows details and an activity timeline.", [{click:byText(".my-navitem","Overview",true)}], 3000],
    ["Case Briefing: a summary and the numbered source records behind it.", [{click:byText(".my-navitem","Case Briefing",true)}], 3000],
    ["Open Agentforce from the utility bar and ask a question.", [{click:()=>UTIL_OPEN==="agent"?null:agentBtn()},{type:bySel("#chatInput"),text:"What is the customer reporting?"},{wait:4800}], 1200],
    ["Citation chips link back to the source records.", [{click:bySel(".my-chat-cite")},{wait:1500},{click:()=>UTIL_OPEN==="agent"?agentBtn():null}], 1200],
    ["Data 360 field mapping: source fields on the left, Data Model entities on the right.", [{click:byText(".my-navitem","Data 360 Mapping",true)},{wait:3800}], 1500],
    ["Click a source field, then a target field, to create a mapping.", [{click:bySel('[data-src="Phone"]')},{click:bySel('[data-tgt="Contact Point Phone.Phone Number"]')},{wait:900}], 1500],
    ["Click a transform node to remove a mapping.", [{click:bySel('.my-map-node[data-f="Annual Revenue"]')},{wait:600}], 1500],
    ["Save the mappings.", [{click:bySel('[data-act="save"]')},{wait:800}], 1500],
    ["Results, step 1: figures build in one at a time.", [{click:byText(".my-navitem","Results",true)},{wait:3300}], 1500],
    ["Results, step 2: the headline stays pinned while the details scroll.", [{click:bySel("#nextBtn")}], 3500],
  ],
});
walk.bindKeys();

boot();
</script>
